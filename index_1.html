ruoe:[
 {part:1,title:"The Rise of Esports",
  text:"Not long ago, playing video games was seen as a waste of time. Today, however, professional gaming, or 'esports', has {1} into a huge international industry. Top players {2} part in tournaments watched by millions of fans around the world, and the best teams can win prizes {3} millions of dollars. Like traditional athletes, professional gamers follow strict training programmes. They often practise for eight hours a day and {4} close attention to their diet and fitness. Some universities now even {5} scholarships to talented players. However, not everyone is convinced. Critics argue that spending so long in front of a screen can {6} a negative effect on young people's health. Supporters, {7} the other hand, believe that esports teach valuable skills such as teamwork and quick thinking. Whatever your opinion, it seems that esports are here to {8}.",
  items:[
   {n:1,o:["grown","risen","raised","increased"],a:0,e:"grow into（發展成為）。rise/increase 不接 into + 名詞這種用法，raise 是及物動詞。"},
   {n:2,o:["take","have","make","do"],a:0,e:"take part in（參加）。"},
   {n:3,o:["worth","valued","costing","priced"],a:0,e:"prizes worth millions（價值數百萬的獎金）。valued 要加 at。"},
   {n:4,o:["pay","give","put","take"],a:0,e:"pay attention to（注意）。"},
   {n:5,o:["offer","hand","pass","lend"],a:0,e:"offer scholarships to（提供獎學金給）。"},
   {n:6,o:["have","make","do","take"],a:0,e:"have an effect on（對…有影響）。"},
   {n:7,o:["on","in","at","by"],a:0,e:"on the other hand（另一方面）是固定說法。"},
   {n:8,o:["stay","remain","keep","last"],a:0,e:"be here to stay（會一直存在下去）是固定說法。"}]},
 {part:2,title:"The Four-Day School Week",
  text:"In some parts of the world, schools have started experimenting with a four-day week. Students attend school {9} Monday to Thursday, and Fridays are free {10} sports, hobbies or family time. {11} the school day is slightly longer, students actually spend about the same number of hours in lessons overall. Supporters say the change has {12} number of benefits. Teachers report that students are less tired and more focused, and attendance has improved. However, not everyone is in favour {13} the idea. Some parents find it difficult to arrange childcare on Fridays, especially {14} both parents work full-time. Others worry that students will simply spend the extra day playing computer games. It is still too early to say {15} the four-day week will become common, but it is certainly an idea {16} is being taken seriously.",
  items:[
   {n:9,a:["from"],e:"from Monday to Thursday（從星期一到星期四）。"},
   {n:10,a:["for"],e:"free for + 用途（空出來做…）。"},
   {n:11,a:["because","as","since"],e:"因為每天上課時間比較長，所以總時數差不多 → Because / As / Since。"},
   {n:12,a:["a"],e:"a number of（一些、許多）。"},
   {n:13,a:["of"],e:"in favour of（贊成）。"},
   {n:14,a:["when","if"],e:"especially when/if both parents work（尤其是當父母都上班時）。"},
   {n:15,a:["whether","if"],e:"too early to say whether…（現在說是否…還太早）。"},
   {n:16,a:["that","which"],e:"an idea that is being taken seriously → 關係代名詞 that / which。"}]},
 {part:3,title:"The Benefits of Boredom",
  text:"We usually think of boredom as something to avoid. But some psychologists now believe that being bored can be surprisingly {17}. When we have nothing to do, our minds start to wander, and this can lead to {18} ideas. Many famous {19} have said their best ideas came to them during quiet moments. {20}, modern technology means we are rarely bored. As soon as we have a spare minute, we reach for our phones. Experts say this constant {21} may be reducing our {22} to think creatively. They suggest that parents should not worry too much when children complain of having nothing to do, as boredom can encourage {23}. In other words, a little boredom is {24} fine.",
  items:[
   {n:17,stem:"USE",a:["useful"],e:"can be surprisingly ___ → 形容詞 useful（有用的）。"},
   {n:18,stem:"EXPECT",a:["unexpected"],e:"lead to ___ ideas → 形容詞 unexpected（意想不到的）。"},
   {n:19,stem:"INVENT",a:["inventors"],e:"Many famous ___ have said → 人，複數 inventors。"},
   {n:20,stem:"SAD",a:["sadly"],e:"句首表示「可惜的是」→ 副詞 Sadly。"},
   {n:21,stem:"ENTERTAIN",a:["entertainment"],e:"this constant ___ → 名詞 entertainment（娛樂）。"},
   {n:22,stem:"ABLE",a:["ability"],e:"our ___ to think → 名詞 ability（能力）。"},
   {n:23,stem:"INDEPENDENT",a:["independence"],e:"encourage ___ → 名詞 independence（獨立）。"},
   {n:24,stem:"ABSOLUTE",a:["absolutely"],e:"修飾形容詞 fine → 副詞 absolutely。"}]},
 {part:4,
  items:[
   {n:25,s1:"I'm sure Anna didn't break the window.",key:"CAN'T",s2:"Anna ____ the window.",chunks:[["can't have"],["broken"]],full:"can't have broken",e:"確定過去「不可能」做了某事 → can't have + 過去分詞。"},
   {n:26,s1:"It's a long time since I last saw them.",key:"FOR",s2:"I ____ a long time.",chunks:[["haven't seen","have not seen"],["them for"]],full:"haven't seen them for",e:"It's a long time since… = 已經很久沒… → 現在完成式 haven't seen them for。"},
   {n:27,s1:"The test was easier than I expected.",key:"AS",s2:"The test wasn't ____ I expected.",chunks:[["as difficult","as hard"],["as"]],full:"as difficult as",e:"easier than = not as difficult as（沒有像…那麼難）。"},
   {n:28,s1:"Please don't make so much noise.",key:"MIND",s2:"Would you ____ so much noise?",chunks:[["mind"],["not making"]],full:"mind not making",e:"Would you mind + V-ing（可以請你…嗎）；否定是 mind not making。"},
   {n:29,s1:"'I'll help you with your homework,' said Dad.",key:"OFFERED",s2:"Dad ____ with my homework.",chunks:[["offered to"],["help me"]],full:"offered to help me",e:"offer to do something（主動提出要做…）；you 轉述時變成 me。"},
   {n:30,s1:"They cancelled the match because of the rain.",key:"CALLED",s2:"The match ____ because of the rain.",chunks:[["was called"],["off"]],full:"was called off",e:"call off = cancel（取消）；被動 was called off。"}]},
 {part:5,title:"A Lesson from an Owl",
  passage:["I've always loved animals, so when our local wildlife rescue centre asked for teenage volunteers, I signed up straight away. I imagined myself feeding baby deer and playing with fox cubs. The reality, as I soon discovered, was rather different.",
   "For the first two weeks, my main job was cleaning. I scrubbed cages, washed bowls and swept floors until my arms ached. I'll admit I was disappointed. One afternoon, I complained to the manager, Ruth, that I wasn't doing anything 'real'. She looked at me for a moment and then said, 'Clean cages stop animals getting sick. That's about as real as it gets.' I didn't complain after that.",
   "In my third week, a woman brought in a young owl she had found by the side of the road. One of its wings was badly injured. Ruth asked me to help her examine it, and I was amazed by how calm she stayed, speaking softly to the frightened bird the whole time. She told me the owl had probably been hit by a car and that it might never fly again.",
   "Over the next month, I helped to feed the owl and watched as its wing slowly healed. Ruth warned me not to get too attached – the aim, she said, was always to return animals to the wild, not to keep them as pets. It was good advice, but hard to follow. I found myself thinking about the owl even when I was at school.",
   "On the day we released it, I felt a mixture of pride and sadness. The owl sat on my glove for a few seconds, as if it was deciding whether to trust its wing. Then it took off, flew low over the field and disappeared into the trees. I still volunteer at the centre every weekend, and I still clean a lot of cages. But now I understand why it matters."],
  items:[
   {n:31,q:"What does the writer say about his expectations before he started?",o:["He thought the work would be easy.","He expected to spend time with young animals.","He was worried about being bitten.","He hoped to become a vet."],a:1,e:"第 1 段：想像自己餵小鹿、和小狐狸玩 → B。"},
   {n:32,q:"Why did the writer stop complaining about the cleaning?",o:["Ruth gave him more interesting jobs.","He understood why it was important.","He was afraid of losing his place.","Other volunteers did the cleaning instead."],a:1,e:"Ruth 說乾淨的籠子能讓動物不生病，他就懂了 → B。"},
   {n:33,q:"What impressed the writer when the owl arrived?",o:["how quickly Ruth worked","how gently Ruth treated the bird","how badly the owl was injured","how large the owl was"],a:1,e:"amazed by how calm she stayed, speaking softly → B。"},
   {n:34,q:"What does 'get too attached' mean in paragraph 4?",o:["spend too much time at the centre","develop strong feelings for the animal","hold the bird too tightly","become too confident"],a:1,e:"get attached = 產生感情；後面說目的是放回野外不是當寵物 → B。"},
   {n:35,q:"How did the writer feel on the day the owl was released?",o:["completely happy","both proud and sad","worried that it would not survive","annoyed that it flew away"],a:1,e:"a mixture of pride and sadness → B。"},
   {n:36,q:"What has changed for the writer by the end of the article?",o:["He no longer has to clean cages.","He now sees the value of his everyday tasks.","He has decided to work only with owls.","He volunteers less often than before."],a:1,e:"I still clean a lot of cages. But now I understand why it matters → B。陷阱 A：他還是在清籠子。"}]},
 {part:6,title:"Why Do We Yawn?",
  passage:["Everyone yawns – and so do most animals, from dogs to fish. Yet scientists still do not fully understand why we do it. {37}",
   "For a long time, it was believed that yawning helped to bring more oxygen into the body when levels were low. {38} When volunteers breathed air with extra oxygen, they yawned just as often as usual.",
   "A more recent theory is that yawning helps to cool the brain. Like a computer, the brain works best at a certain temperature. {39} Supporting this idea, studies have found that people yawn more in warm weather than in very hot or very cold conditions.",
   "Perhaps the most mysterious thing about yawning is that it is 'catching'. {40} Even reading about yawning can be enough – you may have yawned already while reading this article!",
   "Interestingly, people are more likely to catch a yawn from family members and close friends than from strangers. {41} This has led some researchers to suggest that catching yawns is linked to our ability to understand how others feel.",
   "Young children do not usually catch yawns until they are about four or five years old. {42} So the next time someone accuses you of yawning because you are bored, you can tell them you are simply showing how much you care."],
  sents:{A:"However, experiments have not supported this idea.",B:"Taking in a large amount of air may help to bring its temperature down.",C:"Watching someone else yawn often makes us yawn too.",D:"This is around the same age at which they start to recognise other people's emotions.",E:"Several explanations have been suggested, but none has been fully proved.",F:"Dogs have even been seen yawning after watching their owners yawn.",G:"Fish, however, are the only animals that never yawn."},
  items:[
   {n:37,a:"E",e:"前面說科學家還不完全了解原因，E 接著說有幾種解釋但都沒證實 → E。"},
   {n:38,a:"A",e:"前面說以前認為打哈欠是補充氧氣，However… not supported；後面舉實驗反證 → A。"},
   {n:39,a:"B",e:"前面說大腦在某個溫度最好運作，B 說吸大量空氣能降溫（its = the brain's）→ B。"},
   {n:40,a:"C",e:"前面說打哈欠會「傳染」，C 解釋：看到別人打哈欠我們也會；後面 Even reading… → C。"},
   {n:41,a:"F",e:"前面說會從親近的人身上「傳染」，F 補充連狗也會跟主人打哈欠；後面說和理解別人感受有關 → F。"},
   {n:42,a:"D",e:"前面說四、五歲才會被傳染，D 說這剛好是開始認識別人情緒的年紀 → D。G 和第一句矛盾（文中說魚也會打哈欠），用不到。"}]},
 {part:7,
  texts:[
   {id:"A",name:"Ruby",t:"Last year I decided to read one book a week for a whole year. I'd always been a slow reader, so my friends were sure I'd give up by February. There were weeks when I had to stay up late to finish, but I managed fifty-two books in the end. The best part was discovering types of books I'd never have tried, like science fiction."},
   {id:"B",name:"Kai",t:"I did a sponsored silence for 24 hours to raise money for a children's hospital. It sounds easy, but it was incredibly hard – I'm a very talkative person! My little sister kept trying to make me laugh. In the end I raised over £400, which was much more than I'd hoped for."},
   {id:"C",name:"Priya",t:"I spent the summer learning to juggle. It started as a joke after my brother said I'd never be able to do it. I practised for an hour every day and dropped the balls hundreds of times. Now I can juggle five balls, and I've even performed at a local festival. My brother has stopped laughing at me!"},
   {id:"D",name:"Felix",t:"My challenge was to cycle from my home to my grandparents' village – about 200 kilometres – over three days. My dad came with me. On the second day it poured with rain and we got completely lost, which I actually think was the most memorable part. I'd love to do a longer ride next year, maybe across another country."}],
  items:[
   {n:43,q:"took on the challenge because someone said they couldn't do it?",a:"C",e:"Priya：my brother said I'd never be able to do it。陷阱 A：朋友覺得她會放棄，但那不是她開始的原因。"},
   {n:44,q:"raised money for a good cause?",a:"B",e:"Kai：raise money for a children's hospital。"},
   {n:45,q:"discovered new interests through the challenge?",a:"A",e:"Ruby：discovering types of books I'd never have tried。"},
   {n:46,q:"had a family member who tried to make the challenge harder?",a:"B",e:"Kai：My little sister kept trying to make me laugh。"},
   {n:47,q:"completed the challenge with a parent?",a:"D",e:"Felix：My dad came with me。"},
   {n:48,q:"says that something going wrong became a highlight?",a:"D",e:"Felix：迷路了，which I actually think was the most memorable part。"},
   {n:49,q:"has shown their new skill in public?",a:"C",e:"Priya：I've even performed at a local festival。"},
   {n:50,q:"achieved more than they had expected?",a:"B",e:"Kai：raised over £400, much more than I'd hoped for。"},
   {n:51,q:"sometimes had to sacrifice sleep?",a:"A",e:"Ruby：weeks when I had to stay up late to finish。"},
   {n:52,q:"would like to attempt a bigger version of the challenge?",a:"D",e:"Felix：I'd love to do a longer ride next year。"}]}
],
lis:[
 {part:1,items:[
   {n:1,q:"You hear a boy talking about a concert. What disappointed him?",o:["the band's performance","the size of the crowd","the sound quality"],a:2,s:[["B","The band were brilliant – they played all my favourite songs. The place was packed, which made the atmosphere amazing."],["B","It's just a shame the speakers were so bad. Half the time you couldn't make out the words."]],e:"喇叭很差、聽不清楚歌詞 → C。"},
   {n:2,q:"You hear a girl talking to a shop assistant. What does she want to do?",o:["return an item for her money back","exchange an item","buy a new item"],a:1,s:[["G","Hi, I bought this jacket here last week, but it's a bit too small."],["G","I don't want my money back – I really like it – I'd just like the same one in a bigger size, please."]],e:"不要退錢，想換大一號 → 換貨 B。"},
   {n:3,q:"You hear a teacher talking about a science project. What must students do first?",o:["choose a partner","pick a topic","read some articles"],a:1,s:[["W","Before you do anything else, you need to decide what your project will be about – you'll find a list of ideas on the school website."],["W","Once you've done that, you can choose who to work with, and then start your research."]],e:"Before you do anything else… decide what your project will be about → 先選主題 B。"},
   {n:4,q:"You hear two friends talking about a computer game. What does the girl say about it?",o:["It's too difficult.","It's better than the first version.","It's too expensive."],a:1,s:[["B","Have you played the new version yet?"],["G","Yes, and I think it's much better than the first one – the graphics are amazing. It's not easy, but that's what makes it fun."]],e:"much better than the first one → B。陷阱 A：不簡單，但她覺得這樣才好玩。"},
   {n:5,q:"You hear a boy talking about his best friend. What does he value most about him?",o:["He is funny.","He is loyal.","He is clever."],a:1,s:[["B","Max is really clever, and he always makes me laugh."],["B","But the thing I value most is that he's always on my side. When I got into trouble last year, he was the only one who stood by me."]],e:"always on my side、stood by me → 忠誠 B。"},
   {n:6,q:"You hear a woman talking about a new bus service. What is its main advantage?",o:["It is cheaper.","It runs more often.","It is faster."],a:1,s:[["W","The new number 12 bus costs the same as the old service, and the journey takes about the same time."],["W","The big difference is that buses now come every ten minutes instead of every half an hour."]],e:"每 10 分鐘一班，比以前 30 分鐘一班更頻繁 → B。"},
   {n:7,q:"You hear a girl talking about learning to swim. How does she feel now?",o:["confident","frightened","bored"],a:0,s:[["G","When I was little, I was terrified of water. I wouldn't even put my face in the bath!"],["G","But after a year of lessons, I can swim a whole length without stopping, and I'm not scared at all any more."]],e:"現在可以一口氣游完一趟、完全不怕 → A。陷阱 B：害怕是以前。"},
   {n:8,q:"You hear a boy leaving a message for a friend. Why is he calling?",o:["to apologise","to invite her somewhere","to ask for help"],a:0,s:[["B","Hi Lucy, it's Ben. Listen, I'm really sorry about what I said yesterday. I didn't mean it, and I felt terrible all night."],["B","I hope we're still friends."]],e:"I'm really sorry about what I said → 道歉 A。"}]},
 {part:2,
  s:[["G","Hi, I'm Emma, and I'm going to tell you about Science Week at our school, which happens every March."],
     ["G","This year's theme was space. On the first day, a scientist who works for a space agency came to give a talk. She showed us a real piece of rock from the Moon, which was much smaller than I'd expected – about the size of a coin."],

/* ================= paper builder: fixed sets or random mix ================= */
const META={ruoe:{title:'Reading and Use of English',zh:'閱讀與文法字彙',real:75,mins:75},lis:{title:'Listening',zh:'聽力',real:40,mins:40},wri:{title:'Writing',zh:'寫作',real:80,mins:80},spk:{title:'Speaking',zh:'口說',real:14,mins:14}};
let SET=store.get('set',1);
const K=k=>k+'_s'+SET;
let RUOE,LIS,WRI,SPK;const PAPERS={};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const pickSet=s=>s==='mix'?1+Math.floor(Math.random()*3):s;
const clone=x=>JSON.parse(JSON.stringify(x));
function buildPaper(id,set){const M=META[id];
  if(id==='ruoe'||id==='lis'){const PM=id==='ruoe'?RU_META:LI_META;let n=0;
    const parts=Object.keys(PM).map(Number).map(pn=>{const src=SETS[pickSet(set)][id].find(p=>p.part===pn);const p=Object.assign(clone(src),PM[pn]);
      const map={};p.items.forEach(it=>{n++;map[it.n]=n;it.n=n;});
      const rn=s=>s.replace(/\{(\d+)\}/g,(_,k)=>'{'+map[k]+'}');
      if(p.text)p.text=rn(p.text);if(p.passage)p.passage=p.passage.map(rn);
      p.instr=p.instr.replace('{R}',p.items[0].n+'–'+p.items[p.items.length-1].n);
      p.items.forEach(it=>{if(Array.isArray(it.o)&&typeof it.a==='number'){const perm=shuffle([...it.o.keys()]);const o=it.o;it.a=perm.indexOf(it.a);it.o=perm.map(i=>o[i]);}});
      return p;});
    return {id,...M,parts,set};}
  if(id==='wri'){return {id,...M,p1:Object.assign(clone(SETS[pickSet(set)].wri.p1),{title:'Part 1 · Essay（必寫）'}),p2:clone(SETS[pickSet(set)].wri.p2),set};}
  const steps=[];[1,2,3,4].forEach(pn=>steps.push(...clone(SETS[pickSet(set)].spk.filter(s=>s.part===pn))));return {id,...M,steps,set};}
function usePaper(id,P){PAPERS[id]=P;if(id==='ruoe')RUOE=P;if(id==='lis')LIS=P;if(id==='wri')WRI=P;if(id==='spk')SPK=P;}
function getPaper(id){let P=store.get(K('paper_'+id),null);if(!P){P=buildPaper(id,SET);store.set(K('paper_'+id),P);if(id==='lis'){PLAYS={};store.set(K('plays'),{});}}usePaper(id,P);return P;}
const SETNAME=s=>s==='mix'?'🎲 隨機混合':'第 '+s+' 回';
function setSet(s){SET=s;store.set('set',s);PLAYS=store.get(K('plays'),{});render();}


/* ================= capabilities (optional) ================= */
let SAMPLE=null,DICT=null;
/* offline: use the browser's own speech recognition (Chrome / Edge / Android) when available */
function makeDict(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;let rec=null;const cb={};
  return {onPartial(f){cb.p=f},onFinal(f){cb.f=f},onState(f){cb.s=f},
   start(){return new Promise((res,rej)=>{try{rec=new SR();rec.lang='en-GB';rec.interimResults=true;rec.continuous=true;
     rec.onresult=e=>{let interim='';for(let k=e.resultIndex;k<e.results.length;k++){const r=e.results[k];if(r.isFinal)cb.f&&cb.f({text:r[0].transcript.trim()});else interim+=r[0].transcript;}cb.p&&cb.p({text:interim});};
     rec.onerror=ev=>{if(ev.error==='not-allowed'||ev.error==='service-not-allowed')rej({code:'not_granted'});};
     rec.onend=()=>{micOnFlag=false;cb.s&&cb.s({state:'idle',reason:'stopped'});};
     rec.onstart=()=>{cb.s&&cb.s({state:'listening'});res();};rec.start();}catch(e){rej(e)}});},
   stop(){try{rec&&rec.stop()}catch(e){}return Promise.resolve();}};}
DICT=makeDict();
if(DICT){DICT.onPartial(({text})=>{const l=$('#live');if(l)l.textContent=text;});
  DICT.onFinal(({text})=>{const ta=$('#spkText');if(ta){ta.value=(ta.value?ta.value.trim()+' ':'')+text;saveSpk();}const l=$('#live');if(l)l.textContent='';});
  DICT.onState(({state})=>{const b=$('#micBtn');if(!b)return;const on=state==='listening';b.classList.toggle('on',on);b.textContent=on?'⏹ 停止錄音':'🎙 開始錄音';});}
/* copy with a fallback box when the clipboard is blocked */
function copyText(txt,label){const fallback=()=>modal(`<h3>請複製下面的文字</h3><p class="small">長按或全選後複製</p><textarea id="cpBox" style="min-height:200px;font-size:13px">${esc(txt)}</textarea>`,[['完成','b-main']]);
  try{navigator.clipboard.writeText(txt).then(()=>toast(label||'已複製！'),()=>{fallback();setTimeout(()=>{const b=$('#cpBox');b&&b.select();},50);});}catch(e){fallback();}}
async function askClaude(prompt){if(!SAMPLE)throw {code:'none'};
  let r;try{r=await SAMPLE.json(prompt,{modelTier:'complex'});}catch(e){if(e&&e.code)throw e;const t=await SAMPLE(prompt,{modelTier:'complex'});r=JSON.parse(t.text.replace(/^[^{]*/,'').replace(/[^}]*$/,''));}
  if(r&&typeof r==='object'&&'text' in r&&!('scores' in r)){try{r=JSON.parse(r.text.replace(/^[^{]*/,'').replace(/[^}]*$/,''))}catch(e){}}
  return r;}

/* ================= TTS ================= */
const VOICE={G:{pitch:1.35,rate:.92},B:{pitch:1.15,rate:.92},W:{pitch:1.0,rate:.9},E:{pitch:1.0,rate:.88}};
function speak(lines,done){try{const s=speechSynthesis;s.cancel();const vs=s.getVoices().filter(v=>v.lang&&v.lang.startsWith('en'));const gb=vs.filter(v=>v.lang==='en-GB');const pool=gb.length?gb:vs;
  const pick={G:pool[0],B:pool[1]||pool[0],W:pool[2]||pool[0],E:pool[0]};
  lines.forEach(([sp,t],i)=>{const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';Object.assign(u,VOICE[sp]||VOICE.E);if(pick[sp])u.voice=pick[sp];if(i===lines.length-1)u.onend=()=>done&&done();s.speak(u);});}
  catch(e){toast('無法播放聲音');done&&done();}}
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){}}

/* ================= timer ================= */
function startTimer(mins,onEnd){clearInterval(timerId);endAt=Date.now()+mins*60000;const t=$('#timer');t.style.display='block';
  const tick=()=>{const left=Math.max(0,Math.round((endAt-Date.now())/1000));t.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');t.classList.toggle('low',left<=120);
    if(left<=0){clearInterval(timerId);onEnd();}};tick();timerId=setInterval(tick,1000);}
function stopTimer(){clearInterval(timerId);$('#timer').style.display='none';}

function petAnalysis(v){const ks=['R','W','L','S'];const O=Math.round(ks.reduce((a,k)=>a+v[k],0)/4);
  const petG=O>=160?'Pass at Grade A（B2）':O>=153?'Pass at Grade B（B1）':O>=140?'Pass at Grade C（B1）':O>=120?'Level A2':'未達 A2';
  const lo=110,hi=180,pct=x=>Math.max(0,Math.min(100,(x-lo)/(hi-lo)*100));
  const bars=ks.map(k=>`<div class="bar"><span>${PSK[k][1]}</span><div class="track"><div class="fill" style="width:${pct(v[k])}%;background:${v[k]>=160?'var(--green)':v[k]>=150?'#E0A800':'var(--red)'}"></div><div class="mark" style="left:${pct(160)}%"></div></div><span class="bal">${v[k]}</span></div>`).join('')+`<div class="bar"><span><b>Overall</b></span><div class="track"><div class="fill" style="width:${pct(O)}%;background:var(--navy)"></div><div class="mark" style="left:${pct(160)}%"></div></div><span class="bal">${O}</span></div>`;
  const order=[...ks].sort((a,b)=>v[a]-v[b]);const strong=ks.filter(k=>v[k]>=160),weak=order.filter(k=>v[k]<160);
  const head=O>=160?'已經有 B2 實力，可以直接用模擬考確認 FCE 程度。':O>=150?'接近 B2，模擬考可以找出還差在哪裡。':O>=140?'目前是 B1，模擬考會比較吃力，重點是找出最弱的題型。':'目前低於 B1，建議先多練基礎，模擬考當作「看看題型」就好。';
  const tips={R:'閱讀 Part 5–7 文章較長，注意「換句話說」和陷阱選項。',W:'寫作要寫滿 140–190 字，Essay 的兩個重點＋自己的點子都要寫到。',L:'聽力每段只播 2 次，先讀題目再聽，注意「最後的決定」。',S:'口說每題都要加理由和例子，Part 2 要講滿 1 分鐘。'};
  return `<div class="bars" style="padding:12px 0 4px">${bars}<div class="small">黑線＝160（FCE 及格線）。PET 總分 ${O}・${petG}</div></div>
   <div class="ai"><p><b>${head}</b></p>
   ${strong.length?`<p>💪 強項：${strong.map(k=>PSK[k][0]+' '+v[k]).join('、')}，已經達到 B2。</p>`:''}
   ${weak.length?`<p>🎯 要加強（由弱到強）：${weak.map(k=>`<b>${PSK[k][0]} ${v[k]}</b>（差 ${160-v[k]}）`).join('、')}</p>`:''}
   <p>📌 FCE 比 PET 多一份 <b>Use of English（文法字彙）</b>，PET 成績看不出這部分，模擬考時要特別注意。</p>
   ${weak.length?`<p><b>模擬考建議先考：</b>${weak.slice(0,2).map(k=>PSK[k][1]).join('、')}</p><ul style="margin:4px 0">${weak.slice(0,2).map(k=>`<li>${tips[k]}</li>`).join('')}</ul>`:''}</div>`;}

function sorHTML(R){const comps=[['Reading',R.ruoe&&R.ruoe.readScale],['Use of English',R.ruoe&&R.ruoe.uoeScale],['Writing',R.wri&&!R.wri.pending&&R.wri.scale],['Listening',R.lis&&R.lis.scale],['Speaking',R.spk&&!R.spk.pending&&R.spk.scale]];
  const done=comps.filter(c=>c[1]);if(!done.length)return '<div class="card small">完成任一份考卷後，這裡會出現類似正式成績單的分數圖。</div>';
  const all=done.length===5;const ov=Math.round(done.reduce((a,c)=>a+c[1],0)/done.length);
  const lo=120,hi=190,pct=x=>Math.max(0,Math.min(100,(x-lo)/(hi-lo)*100));
  return `<div class="sor"><div class="top"><span>B2 First for Schools（模擬）</span><span>${all?'Overall '+ov+'・'+grade(ov):'已完成 '+done.length+'/5 項'}</span></div>
  <div class="bars">${comps.map(([n,v])=>`<div class="bar"><span>${n}</span><div class="track">${v?`<div class="fill" style="width:${pct(v)}%"></div>`:''}<div class="mark" style="left:${pct(160)}%"></div></div><span class="bal" style="font-size:13px">${!v?'—':v<=102?'未得分':v+'<br>'+level(v)}</span></div>`).join('')}
  ${all?`<div class="bar"><span><b>Overall</b></span><div class="track"><div class="fill" style="width:${pct(ov)}%;background:var(--navy)"></div><div class="mark" style="left:${pct(160)}%"></div></div><span class="bal">${ov}</span></div>`:''}
  <div class="small">黑線＝160（B2 及格）。160–172 Grade C、173–179 Grade B、180 以上 Grade A。分數為估算。</div></div></div>${petCompare(R)}`;}
function petCompare(R){const v=store.get('pet',null);if(!v)return '';
  const mock={R:R.ruoe&&R.ruoe.readScale,W:R.wri&&!R.wri.pending&&R.wri.scale,L:R.lis&&R.lis.scale,S:R.spk&&!R.spk.pending&&R.spk.scale};
  if(!Object.values(mock).some(Boolean))return '';
  return `<div class="card"><h3>📈 和 PET 成績比較</h3><table><tr><th>項目</th><th>PET</th><th>FCE 模擬</th><th>變化</th></tr>${'RWLS'.split('').map(k=>{const m=mock[k];const d=m?m-v[k]:null;
    return `<tr><td>${PSK[k][0]}</td><td>${v[k]}</td><td>${m?(m<=102?'未得分':m):'—'}</td><td class="${d===null?'':d>=0?'ok':'no'}">${d===null?'尚未考':d>=0?'▲ '+d:'▼ '+(-d)}</td></tr>`;}).join('')}</table>
   <p class="small" style="margin-top:6px">兩種考試用同一把分數尺，可以直接比較。模擬考題數少、分數是估算，差 5 分以內都算正常起伏。</p></div>`;}

function allItems(){return PAPERS[S.paper].parts.flatMap(p=>p.items);}
function totalItems(){return allItems().length;}
function answeredCount(){return allItems().filter(it=>ANS[it.n]!==undefined&&String(ANS[it.n]).trim()!=='').length;}

function gapInput(n,cls){const v=ANS[n]??'';return `<span class="gapn">${n}</span><input class="${cls||''}" data-n="${n}" value="${esc(v)}" autocomplete="off" autocapitalize="off" spellcheck="false">`;}
function radioGroup(n,opts,inline){return `<div class="opts ${inline?'inline-opts':''}">${opts.map((o,j)=>`<label class="${ANS[n]===j?'sel':''}"><input type="radio" name="q${n}" data-n="${n}" value="${j}" ${ANS[n]===j?'checked':''}><span><b>${'ABCD'[j]}</b>　<span class="en">${esc(o)}</span></span></label>`).join('')}</div>`;}
function selectBox(n,letters){return `<select data-n="${n}"><option value="">— 選擇 —</option>${letters.map(l=>`<option ${ANS[n]===l?'selected':''}>${l}</option>`).join('')}</select>`;}
function bindInputs(){document.querySelectorAll('[data-n]').forEach(el=>{const n=+el.dataset.n;
  const upd=()=>{if(el.type==='radio'){ANS[n]=+el.value;document.querySelectorAll(`input[name="q${n}"]`).forEach(r=>r.closest('label').classList.toggle('sel',r.checked));}else ANS[n]=el.value;saveDraft();$('#footInfo').textContent=`已作答 ${answeredCount()} / ${totalItems()}`;};
  el.addEventListener(el.tagName==='SELECT'||el.type==='radio'?'change':'input',upd);});}

function renderRuoePart(p){let h='';
  if(p.type==='mcCloze'){h+=`<div class="card"><h3 class="en">${p.title}</h3><div class="passage en">${p.text.replace(/\{(\d+)\}/g,(_,n)=>`<span class="gapn">${n}</span>______`)}</div></div><div class="card">${p.items.map(it=>`<div class="q"><span class="qn">${it.n}</span>${radioGroup(it.n,it.o,true)}</div>`).join('')}</div>`;}
  if(p.type==='open'||p.type==='wf'){const stems={};p.items.forEach(it=>stems[it.n]=it.stem);
    h+=`<div class="card"><h3 class="en">${p.title}</h3><div class="passage en">${p.text.replace(/\{(\d+)\}/g,(_,n)=>gapInput(+n)+(stems[n]?`<span class="stem">(${stems[n]})</span>`:''))}</div></div>`;}
  if(p.type==='kwt'){h+=`<div class="card">${p.items.map(it=>`<div class="q"><div><span class="qn">${it.n}</span><span class="en" style="font-size:17px">${esc(it.s1)}</span></div><div class="key">${it.key}</div><div class="en" style="font-size:17px">${esc(it.s2).replace('____','<b>__________</b>')}</div><input class="kwin en" data-n="${it.n}" value="${esc(ANS[it.n]??'')}" placeholder="寫 2–5 個字（含框框裡的字）" autocomplete="off" autocapitalize="off" spellcheck="false"></div>`).join('')}</div>`;}
  if(p.type==='mc'){h+=`<div class="card"><h3 class="en">${p.title}</h3><div class="passage en" style="line-height:1.8">${p.passage.map(x=>`<p>${esc(x)}</p>`).join('')}</div></div><div class="card">${p.items.map(it=>`<div class="q"><div><span class="qn">${it.n}</span><span class="en" style="font-weight:600">${esc(it.q)}</span></div>${radioGroup(it.n,it.o)}</div>`).join('')}</div>`;}
  if(p.type==='gapped'){h+=`<div class="card"><h3 class="en">${p.title}</h3><div class="passage en" style="line-height:1.9">${p.passage.map(x=>`<p>${esc(x).replace(/\{(\d+)\}/g,(_,n)=>`<span class="gapn">${n}</span>${selectBox(+n,Object.keys(p.sents))}`)}</p>`).join('')}</div></div><div class="card sentlist"><h3>Sentences</h3>${Object.entries(p.sents).map(([k,v])=>`<p class="en"><b>${k}</b>　${esc(v)}</p>`).join('')}</div>`;}
  if(p.type==='match'){h+=`<div class="card">${p.texts.map(t=>`<div class="textbox"><b>${t.id}　${t.name}</b><p class="en">${esc(t.t)}</p></div>`).join('')}</div><div class="card"><p class="en" style="font-weight:700">Which person…</p>${p.items.map(it=>`<div class="q row" style="justify-content:space-between"><span><span class="qn">${it.n}</span><span class="en">${esc(it.q)}</span></span>${selectBox(it.n,p.texts.map(t=>t.id))}</div>`).join('')}</div>`;}
  return h;}

/* listening: each recording may be played twice, like the real exam */
let PLAYS=store.get(K('plays'),{});
function playBtn(key,lines){const used=PLAYS[key]||0;return `<div class="play"><button class="b-teal" ${used>=2?'disabled':''} onclick='doPlay(${JSON.stringify(key)},this)' data-lines='${esc(JSON.stringify(lines))}'>${used>=2?'已播完':'🔊 播放'}</button><span class="cnt" data-cnt="${esc(key)}">${used>=2?'已播放 2 次':`可以播放 2 次（已播 ${used} 次）`}</span></div>`;}
function doPlay(key,btn){const lines=JSON.parse(btn.dataset.lines);document.querySelectorAll('.play button').forEach(b=>b.disabled=true);
  PLAYS[key]=(PLAYS[key]||0)+1;store.set(K('plays'),PLAYS);const used=PLAYS[key];
  document.querySelector(`[data-cnt="${CSS.escape(key)}"]`).textContent=`播放中…（第 ${used} 次）`;
  speak(lines,()=>{document.querySelectorAll('.play button').forEach(b=>{const k=b.getAttribute('onclick').match(/doPlay\("([^"]+)"/);const u=k?PLAYS[k[1]]||0:0;b.disabled=u>=2;if(u>=2)b.textContent='已播完';});
    const c=document.querySelector(`[data-cnt="${CSS.escape(key)}"]`);if(c)c.textContent=used>=2?'已播放 2 次':`可以再播 1 次`;});}
function renderLisPart(p){let h='';
  if(p.type==='lmc'&&!p.shared){h+=`<div class="card">${p.items.map(it=>`<div class="q"><div><span class="qn">${it.n}</span><span class="en" style="font-weight:600">${esc(it.q)}</span></div>${playBtn('l'+it.n,it.s)}${radioGroup(it.n,it.o)}</div>`).join('')}</div>`;}
  if(p.type==='lmc'&&p.shared){h+=`<div class="card">${playBtn('p'+p.part,p.s)}${p.items.map(it=>`<div class="q"><div><span class="qn">${it.n}</span><span class="en" style="font-weight:600">${esc(it.q)}</span></div>${radioGroup(it.n,it.o)}</div>`).join('')}</div>`;}
  if(p.type==='gapfill'){h+=`<div class="card">${playBtn('p'+p.part,p.s)}<div class="passage en">${p.items.map(it=>`<p>${esc(it.before)} ${gapInput(it.n)} ${esc(it.after)}</p>`).join('')}</div></div>`;}
  if(p.type==='lmatch'){const all=p.items.flatMap((it,i)=>[['E',it.sp+'.'],...it.s]);
    h+=`<div class="card">${playBtn('p'+p.part,all)}<div class="sentlist">${Object.entries(p.opts).map(([k,v])=>`<p class="en"><b>${k}</b>　${esc(v)}</p>`).join('')}</div>${p.items.map(it=>`<div class="q row" style="justify-content:space-between"><span><span class="qn">${it.n}</span><b>${it.sp}</b></span>${selectBox(it.n,Object.keys(p.opts))}</div>`).join('')}</div>`;}
  return h;}

/* ---------- marking ---------- */
function kwtMarks(it,ans){const a=norm(ans);if(!a)return 0;const words=a.split(' ').length+(a.match(/'/g)||[]).length;
  if(words<2||words>5||!a.includes(it.key.toLowerCase()))return 0;
  const has=alt=>new RegExp('(^|\\s)'+alt.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|\\s)').test(a);
  return it.chunks.filter(ch=>ch.some(has)).length;}
function markItem(p,it){const v=ANS[it.n];
  switch(p.type){
   case 'mcCloze':case 'mc':case 'lmc':return v===it.a?1:0;
   case 'open':case 'wf':case 'gapfill':return it.a.map(norm).includes(norm(v))?1:0;
   case 'gapped':case 'match':case 'lmatch':return v===it.a?1:0;
   case 'kwt':return kwtMarks(it,v);}}
function submitPaper(auto){stopTimer();stopSpeak();const id=S.paper,P=PAPERS[id];
  if(id==='wri')return submitWriting();if(id==='spk')return submitSpeaking();
  const parts=P.parts.map(p=>{const got=p.items.map(it=>{const m=markItem(p,it);return p.type==='kwt'?m:m*(p.marks||1);});const max=p.items.length*(p.type==='kwt'?2:(p.marks||1));return {part:p.part,got:got.reduce((a,b)=>a+b,0),max,each:got};});
  const r={answers:ANS,parts,auto,date:new Date().toISOString()};
  const sum=f=>parts.filter(f).reduce((a,x)=>[a[0]+x.got,a[1]+x.max],[0,0]);
  if(id==='ruoe'){const u=sum(x=>x.part<=4),rd=sum(x=>x.part>=5);r.uoeRaw=u;r.readRaw=rd;r.uoeScale=toScale(u[0]/u[1]*100);r.readScale=toScale(rd[0]/rd[1]*100);r.scale=Math.round((r.uoeScale+r.readScale)/2);}
  else{const t=sum(()=>true);r.raw=t;r.scale=toScale(t[0]/t[1]*100);}
  r.paper=PAPERS[id];saveResult(id,r);store.set(K('draft_'+id),{});S={view:'result',paper:id};render();window.scrollTo(0,0);}

function renderResult(m){const id=S.paper,P=PAPERS[id],r=results()[id];
  if(!r){S.view='home';return render();}
  if(id==='wri')return renderWriResult(m,r);if(id==='spk')return renderSpkResult(m,r);
  let h=`<div class="row"><button class="b-ghost" onclick="goHome()">← 回首頁</button></div><h1>${P.title}・成績</h1>`;
  if(r.auto)h+='<div class="beta">⏰ 時間到自動交卷。</div>';
  if(id==='ruoe'){h+=`<div class="grid">${scoreCard('Reading 閱讀（Part 5–7）',r.readScale,r.readRaw,qCount(P,r,p=>p.part>=5))}${scoreCard('Use of English 文法字彙（Part 1–4）',r.uoeScale,r.uoeRaw,qCount(P,r,p=>p.part<=4))}</div>`;}
  else h+=scoreCard('Listening 聽力（Part 1–4）',r.scale,r.raw,qCount(P,r));
  h+=SCALE_NOTE;

const WRUBRIC=`Use the official Cambridge B2 First Writing assessment scale. Score each subscale 0-5:
- Content: all content is relevant; target reader fully informed (all notes + own idea covered for the essay).
- Communicative Achievement: uses the conventions of the task type (essay/article/email/story) to hold the reader's attention and communicate ideas.
- Organisation: well organised, coherent, variety of linking words and cohesive devices.
- Language: range of vocabulary (including less common lexis) and grammar (simple and complex), with good control; errors do not impede communication.
Band 3 in each subscale is roughly the B2 pass standard. Be accurate and fair, not generous. Answers far under 140 words usually lose Content and Communicative Achievement marks.`;
function wPrompt(task,text){return `You are an experienced Cambridge English examiner marking B2 First for Schools Writing. The candidate is a young learner in Taiwan (around 10–14 years old).
${WRUBRIC}

TASK:
${task}

CANDIDATE'S ANSWER (${wordCount(text)} words; required 140–190):
"""${text}"""

Return ONLY valid JSON with this shape:
{"scores":{"content":0-5,"communicative":0-5,"organisation":0-5,"language":0-5},
"summary_zh":"2-3 sentences overall comment",
"strengths_zh":["..."],
"improve_zh":["specific, actionable advice"],
"corrections":[{"original":"exact phrase from the answer","better":"corrected English","why_zh":"short reason"}],
"model":"an improved version of the candidate's answer at B2 level, keeping their ideas, 140-190 words"}
All *_zh fields must be in Traditional Chinese (Taiwan), simple enough for a child to understand. Give up to 6 corrections, choosing the most important errors.`;}
async function submitWriting(){stopTimer();const a=ANS;const W=WRI;const t2=W.p2.find(x=>x.id===a.p2);

async function gradeWriting(){const r=results().wri;if(!r)return;const a=r.answers;const W=WRI;const t2=W.p2.find(x=>x.id===a.p2);
  if(!SAMPLE){render();return;}
  r.pending=true;r.error=null;saveResult('wri',r);render();
  try{const tasks=[[`${W.p1.task}\n\nEssay question: ${W.p1.q}\nNotes: 1. ${W.p1.notes[0]} 2. ${W.p1.notes[1]} 3. (your own idea)`,a.w1||''],t2?[t2.task,a.w2||'']:null];
    const out=[];for(const t of tasks){if(!t||!t[1].trim()){out.push(null);continue;}out.push(await askClaude(wPrompt(t[0],t[1])));}
    const tot=out.map(o=>o?Object.values(o.scores).reduce((x,y)=>x+(+y||0),0):0);
    r.ai=out;r.rawW=[tot[0]+tot[1],40];r.scale=toScale((tot[0]+tot[1])/40*100);r.pending=false;}

  saveResult('wri',r);if(S.view==='result'&&S.paper==='wri')render();}

function scoreSelects(pre,crit,cur){return `<div class="crit" style="row-gap:8px">${crit.map(([k,l])=>`<span>${l}</span><select id="ms_${pre}_${k}"><option value="">—</option>${[0,1,2,3,4,5].map(n=>`<option ${cur&&+cur[k]===n?'selected':''}>${n}</option>`).join('')}</select>`).join('')}</div>`;}
function readSel(pre,crit){const o={};for(const [k] of crit){const v=$('#ms_'+pre+'_'+k).value;if(v==='')return null;o[k]=+v;}return o;}

    <div class="card"><h3>我說的內容 ${DICT?'<span class="small">（錄音會自動轉成文字，也可以自己修改）</span>':''}</h3>
    ${DICT?'<div class="live" id="live"></div>':'<p class="small">這個瀏覽器不能錄音轉文字（需要 Chrome 或 Edge 瀏覽器，電腦或 Android 手機）。請大聲回答，再把說的話打在下面（家長可以幫忙），交卷後 Claude 才能給建議。</p>'}
    <textarea id="spkText" class="en" style="min-height:110px" placeholder="Your answer will appear here…">${esc(texts[S.step]||'')}</textarea></div>`;
  m.innerHTML=h;$('#spkText').oninput=saveSpk;
  $('#foot').style.display='block';$('#footInfo').textContent=`Part ${st.part}`;
  $('#prevBtn').textContent='← 上一題';$('#prevBtn').style.visibility=S.step>0?'visible':'hidden';$('#prevBtn').onclick=()=>{spkStop();micOff();S.step--;render();};
  const last=S.step===SPK.steps.length-1;$('#nextBtn').textContent=last?'結束口說 ✔':'下一題 →';$('#nextBtn').className=last?'b-org':'b-main';
  $('#nextBtn').onclick=()=>{spkStop();micOff();if(last){const n=Object.values(store.get(K('spkText'),{})).filter(x=>x&&x.trim()).length;
      modal(`<h3>結束口說測驗？</h3><p>已記錄 ${n} / ${SPK.steps.length} 題的回答。</p>`,[['返回','b-ghost'],['結束並評分','b-org',()=>submitPaper(false)]]);}
    else{S.step++;render();window.scrollTo(0,0);setTimeout(sayExaminer,400);}};}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function sayExaminer(){if(S.view!=='exam'||S.paper!=='spk')return;const st=SPK.steps[S.step];if(!st)return;speak([['E',st.q]]);}
function spkStart(){const st=SPK.steps[S.step];if(spkTimer){spkStop();return;}spkLeft=st.secs;$('#spkGo').textContent='⏸ 停止';
  spkTimer=setInterval(()=>{spkLeft--;const c=$('#spkClock');if(c){c.textContent=fmt(Math.max(0,spkLeft));c.style.color=spkLeft<=5?'var(--red)':'';}if(spkLeft<=0){spkStop();toast('時間到！');}},1000);}
function spkStop(){clearInterval(spkTimer);spkTimer=null;const b=$('#spkGo');if(b)b.textContent='▶ 開始回答';}
let micOnFlag=false;
function micToggle(){if(!DICT)return;if(micOnFlag){micOnFlag=false;DICT.stop().catch(()=>{});return;}
  micOnFlag=true;DICT.start().catch(e=>{micOnFlag=false;toast(e&&e.code==='not_granted'?'沒有麥克風權限，請用打字':'無法錄音');});if(!spkTimer)spkStart();}
function micOff(){if(DICT&&micOnFlag){micOnFlag=false;DICT.stop().catch(()=>{});}}

function submitSpeaking(){micOff();const texts=store.get(K('spkText'),{});const r={answers:texts,pending:true,date:new Date().toISOString(),paper:SPK};saveResult('spk',r);S={view:'result',paper:'spk'};render();gradeSpeaking();}
async function gradeSpeaking(){const r=results().spk;if(!r||!SAMPLE){render();return;}r.pending=true;r.error=null;saveResult('spk',r);render();
  const tr=SPK.steps.map((st,i)=>`[${st.title}] Examiner: ${st.q}${st.mind?' Prompts: '+st.mind.o.join(', '):''}\nCandidate: ${(r.answers[i]||'(no answer)').trim()}`).join('\n\n');
  const prompt=`You are an experienced Cambridge English examiner assessing B2 First for Schools Speaking. The candidate is a young learner in Taiwan (around 10–14). This is practice: the candidate answered alone (no partner), and you only have a speech-to-text transcript, so pronunciation cannot be judged and Interactive Communication can only be estimated from how they discuss, give opinions and reach a decision.
Score each 0-5 using the B2 First speaking scales (band 3 ≈ B2 pass): grammar_vocab (Grammar and Vocabulary), discourse (Discourse Management: extended answers, relevance, organisation, linking), interactive (Interactive Communication, estimated). Be accurate, not generous. Very short or missing answers score low.

TRANSCRIPT:
${tr}

Return ONLY valid JSON:
{"scores":{"grammar_vocab":0-5,"discourse":0-5,"interactive":0-5},
"summary_zh":"2-3 sentences",
"strengths_zh":["..."],
"improve_zh":["specific advice"],
"parts":[{"part":"Part 1","comment_zh":"...","better":"an example of a stronger B2 answer in English to one question from this part"},{"part":"Part 2",...},{"part":"Part 3",...},{"part":"Part 4",...}],
"useful_phrases":["English phrases the candidate should learn"]}
All *_zh fields in Traditional Chinese (Taiwan), simple enough for a child.`;
  try{const o=await askClaude(prompt);const s=o.scores;const avg=((+s.grammar_vocab||0)+(+s.discourse||0)+(+s.interactive||0))/3;
    r.ai=o;r.scale=toScale(avg/5*100);r.pending=false;}
  catch(e){r.error=e&&e.code==='rate_limited'?'評分請求太頻繁，請稍後再按「重新評分」。':'評分時發生問題，請按「重新評分」再試一次。';}
  saveResult('spk',r);if(S.view==='result'&&S.paper==='spk')render();}
function renderSpkResult(m,r){let h=`<div class="row"><button class="b-ghost" onclick="goHome()">← 回首頁</button></div><h1>Speaking・成績</h1>`;
  if(r.pending&&!r.error&&SAMPLE)h+=`<div class="ai"><span class="spin"></span>　Claude 正在聽你的回答內容並評分…</div>`;
  if(r.error)h+=`<div class="beta">${r.error}　<button class="b-main" onclick="gradeSpeaking()">重新評分</button></div>`;
  h+=`<div class="beta"><b>怎麼批改：</b>按「📋 複製給 AI 批改」，貼到免費版 Claude（claude.ai）或其他 AI，AI 會依劍橋標準給三項分數和建議，再把分數選在下面按「存入分數」。（只看文字無法評發音。）</div>
    <div class="card"><div class="row"><button class="b-org" onclick="copyAIS()">📋 複製給 AI 批改</button></div><p style="margin-top:10px"><b>填入分數</b> <span class="small">（每項 0–5 分）</span></p>${scoreSelects('s',SCRIT,r.manual)}<div class="row" style="margin-top:8px"><button class="b-main" onclick="saveManualS()">💾 存入分數</button></div></div>`;
  if(r.manual&&!r.ai&&!r.pending)h+=`<div class="card"><div class="small">Speaking（依填入分數估算）</div><div class="bigscore">${r.scale}</div><div class="small">${grade(r.scale)}・估算</div><div style="margin-top:6px">${lvPill(r.scale)}</div></div>`;
  const o=r.ai;
  if(o&&!r.pending){h+=`<div class="card"><div class="small">Speaking（依錄音文字估算）</div><div class="bigscore">${r.scale}</div><div class="small">${grade(r.scale)}・估算</div><div style="margin-top:6px">${lvPill(r.scale)}</div></div>
    <div class="ai"><div class="crit"><span>Grammar &amp; Vocabulary 文法字彙</span><b>${o.scores.grammar_vocab} / 5</b><span>Discourse Management 表達組織</span><b>${o.scores.discourse} / 5</b><span>Interactive Communication 互動（估算）</span><b>${o.scores.interactive} / 5</b><span>Pronunciation 發音</span><b>無法評分</b></div><p style="margin-top:8px">${esc(o.summary_zh)}</p></div>
    <div class="card"><p><b>👍 做得好的地方</b></p><ul>${(o.strengths_zh||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p><b>🔧 怎麼改會更好</b></p><ul>${(o.improve_zh||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    ${(o.parts||[]).map(p=>`<div class="card"><h3>${esc(p.part)}</h3><p>${esc(p.comment_zh)}</p><div class="expl"><b>更好的說法：</b><span class="en">${esc(p.better)}</span></div></div>`).join('')}
    ${(o.useful_phrases||[]).length?`<div class="card"><h3>🛟 要學起來的句子</h3><ul class="en">${o.useful_phrases.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}`;}
  h+=`<details class="card"><summary style="cursor:pointer;font-weight:700">我說的內容（錄音文字）</summary>${SPK.steps.map((st,i)=>`<p class="small" style="margin-top:8px"><b>${st.title}</b>：${esc(st.q)}</p><p class="en">${esc(r.answers[i]||'（沒有記錄）')}</p>`).join('')}</details>`;
  h+=`<div class="row"><button class="b-ghost" onclick="retake('spk')">↻ 重考</button>${SAMPLE&&!r.pending?'<button class="b-ghost" onclick="gradeSpeaking()">重新評分</button>':''}<button class="b-main" onclick="goHome()">回首頁</button></div>`;
  m.innerHTML=h;}

render();
</script>
</body>
</html>
