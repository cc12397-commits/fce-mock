<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FCE for Schools 模擬考（離線版）</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
  --bg:#F6F4EF;--card:#fff;--ink:#22223A;--soft:#66657A;--line:#E4E0D6;
  --navy:#1F2D5A;--navy2:#E3E8F6;--orange:#FF8A3D;--teal:#1FB5A6;--teal2:#D3F4EF;
  --red:#D93B41;--red2:#FFE1E1;--green:#22985A;--green2:#DDF6E6;--yellow2:#FFF3CC;--purple:#6C4FE0;--purple2:#ECE7FF;
  --cam:#D0614B;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;line-height:1.65}
input,textarea,select{color:var(--ink);-webkit-text-fill-color:var(--ink);caret-color:var(--ink);font-family:inherit}
input::placeholder,textarea::placeholder{color:#A9A6B8;-webkit-text-fill-color:#A9A6B8}
.en{font-family:Georgia,"Times New Roman",serif}
.bal{font-family:"Baloo 2","Noto Sans TC",sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff}
.hin{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-weight:900;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-weight:500;font-size:12px;opacity:.75}
.timer{margin-left:auto;font-family:"Baloo 2";font-weight:800;font-size:22px;background:rgba(255,255,255,.12);padding:2px 12px;border-radius:10px;white-space:nowrap}
.timer.low{background:var(--red)}
.partnav{max-width:900px;margin:0 auto;display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto}
.partnav button{flex:0 0 auto;background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px}
.partnav button.on{background:#fff;color:var(--navy)}
main{max-width:900px;margin:0 auto;padding:18px 16px 110px}
h1{font-size:24px;line-height:1.3;margin:4px 0 8px;font-weight:900}
h2{font-size:19px;margin:22px 0 10px;font-weight:900}
h3{font-size:16px;margin:0 0 6px;font-weight:800}
p{margin:6px 0}
.sub{color:var(--soft);font-size:15px}
.small{font-size:13px;color:var(--soft)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--navy2);color:var(--navy)}
.pill.g{background:var(--green2);color:#14683B}.pill.r{background:var(--red2);color:#9B1E23}.pill.y{background:var(--yellow2);color:#7A5600}.pill.p{background:var(--purple2);color:#4227B5}
button{font-family:inherit;font-weight:800;font-size:15px;border:none;border-radius:12px;padding:10px 16px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.b-main{background:var(--navy);color:#fff}
.b-org{background:var(--orange);color:#fff}
.b-teal{background:var(--teal);color:#fff}
.b-ghost{background:#fff;color:var(--soft);border:1.5px solid var(--line)}
.b-red{background:var(--red);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.paper{cursor:pointer}
.paper .em{font-size:28px}
.paper .st{font-size:13px;font-weight:700;margin-top:6px}
.instr{background:var(--navy2);border-radius:12px;padding:12px 14px;margin:10px 0}
.instr .en{font-size:15.5px;font-weight:600}
.instr .zh{font-size:13.5px;color:var(--soft);margin-top:4px}
.passage{font-size:17px;line-height:2.05}
.passage p{margin:0 0 10px}
.gapn{display:inline-block;font-family:"Baloo 2";font-weight:800;background:var(--navy);color:#fff;border-radius:6px;padding:0 6px;font-size:13px;line-height:1.6;margin-right:3px}
.passage input{width:110px;font-size:16px;padding:1px 6px;border:1.5px solid #B9B4A6;border-radius:6px;background:#FFFDF8;text-align:center}
.passage .stem{font-family:"Baloo 2";font-weight:800;color:var(--purple);font-size:14px;margin-left:3px}
.q{border-top:1px solid var(--line);padding:12px 0}
.q:first-child{border-top:none}
.qn{font-family:"Baloo 2";font-weight:800;color:var(--navy);margin-right:6px}
.opts label{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border:1.5px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer;background:#FFFDF8}
.opts input{margin-top:5px;width:18px;height:18px;accent-color:var(--navy)}
.opts label.sel{border-color:var(--navy);background:var(--navy2)}
.inline-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.inline-opts label{margin:0}
@media (max-width:560px){.inline-opts{grid-template-columns:1fr 1fr}}
.kwin{width:100%;font-size:16px;padding:9px 10px;border:1.5px solid #B9B4A6;border-radius:10px;background:#FFFDF8;margin-top:6px}
.key{display:inline-block;background:var(--ink);color:#fff;font-weight:800;padding:0 10px;border-radius:6px;font-family:"Baloo 2";letter-spacing:1px;margin:6px 0}
select{font-size:15px;padding:7px 8px;border:1.5px solid #B9B4A6;border-radius:8px;background:#FFFDF8}
.sentlist p{padding:6px 10px;border-radius:8px;background:#FAF8F2;margin:6px 0}
.textbox{background:#FAF8F2;border-radius:12px;padding:10px 14px;margin:8px 0}
.textbox b{font-family:"Baloo 2";color:var(--navy)}
textarea{width:100%;min-height:240px;font-size:16px;line-height:1.7;padding:12px;border:1.5px solid #B9B4A6;border-radius:12px;background:#FFFDF8;resize:vertical}
.wc{font-family:"Baloo 2";font-weight:800}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1.5px solid var(--line);z-index:15}
.footin{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;align-items:center}
.footin .grow{flex:1;font-size:13px;color:var(--soft)}
.play{display:flex;gap:10px;align-items:center;background:var(--teal2);border-radius:12px;padding:10px 12px;margin:8px 0}
.play .cnt{font-size:13px;font-weight:700;color:#0E7067}
/* results */
.res-q{border-top:1px solid var(--line);padding:10px 0;font-size:15px}
.res-q .mk{font-family:"Baloo 2";font-weight:800;float:right}
.ok{color:var(--green)}.no{color:var(--red)}.half{color:#B07800}
.expl{background:#FAF8F2;border-radius:10px;padding:8px 10px;margin-top:6px;font-size:14px}
.bigscore{font-family:"Baloo 2";font-weight:800;font-size:46px;line-height:1;color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--soft);font-size:13px}
.sor{border:2px solid var(--cam);border-radius:14px;overflow:hidden}
.sor .top{background:var(--cam);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-weight:800}
.bars{display:flex;flex-direction:column;gap:10px;padding:14px}
.bar{display:grid;grid-template-columns:120px 1fr 54px;gap:8px;align-items:center;font-size:14px;font-weight:700}
.track{position:relative;height:20px;background:#EFECE4;border-radius:999px}
.fill{height:100%;border-radius:999px;background:var(--cam)}
.mark{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
.ai{border-left:5px solid var(--purple);background:var(--purple2);border-radius:12px;padding:12px 14px;margin:10px 0}
.crit{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:15px}
.crit b{font-family:"Baloo 2";font-size:17px}
.spin{display:inline-block;width:16px;height:16px;border:3px solid var(--purple2);border-top-color:var(--purple);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.pic{background:linear-gradient(160deg,#E7F2FF,#FFF4E3);border-radius:12px;text-align:center;padding:16px 6px;font-size:40px;line-height:1.3;border:1.5px solid var(--line)}
.pic span{display:block;font-size:12px;color:var(--soft);font-family:"Noto Sans TC"}
.mind{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0;text-align:center}
.mind .c{grid-column:1/-1;background:var(--navy);color:#fff;border-radius:12px;padding:10px;font-weight:700}
.mind div:not(.c){background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px;font-size:15px}
.mic{background:var(--red);color:#fff}
.mic.on{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.6}}
.live{color:var(--soft);font-style:italic;min-height:22px;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(20,20,40,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:18px;padding:20px;max-width:380px;width:100%;text-align:center}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
.beta{background:var(--yellow2);border:1.5px dashed #E0B640;border-radius:12px;padding:10px 14px;font-size:14px;margin:10px 0}
.petin{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.petin label{font-size:14px;font-weight:700;display:flex;flex-direction:column;gap:4px}
.petin input{font-size:18px;padding:8px 10px;border:1.5px solid #B9B4A6;border-radius:10px;background:#FFFDF8;width:100%;font-family:'Baloo 2'}
.namebox{display:flex;gap:8px}
.namebox input{flex:1;font-size:17px;padding:9px 12px;border:1.5px solid #B9B4A6;border-radius:10px;background:#FFFDF8;min-width:0}
</style>
</head>
<body>
<header>
  <div class="hin">
    <div class="brand" id="brand">B2 First for Schools 模擬考<small id="brandSub">離線版</small></div>
    <div class="timer" id="timer" style="display:none">00:00</div>
  </div>
  <div class="partnav" id="partnav"></div>
</header>
<main id="main"></main>
<div class="foot" id="foot" style="display:none"><div class="footin"><div class="grow" id="footInfo"></div><button class="b-ghost" id="prevBtn">← 上一部分</button><button class="b-main" id="nextBtn">下一部分 →</button></div></div>
<div class="modal" id="modal"><div class="box"><div id="mBody"></div><div class="row" style="justify-content:center;margin-top:14px" id="mBtns"></div></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= utilities ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:"]/g,'').replace(/\s+/g,' ').trim();
const store={get(k,d){try{const v=localStorage.getItem('fcemock_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('fcemock_'+k,JSON.stringify(v))}catch(e){}}};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1600);}
function modal(html,btns){$('#mBody').innerHTML=html;const w=$('#mBtns');w.innerHTML='';btns.forEach(([t,cls,fn])=>{const b=document.createElement('button');b.className=cls;b.textContent=t;b.onclick=()=>{$('#modal').classList.remove('on');fn&&fn();};w.appendChild(b);});$('#modal').classList.add('on');}
const wordCount=s=>(String(s).trim().match(/[A-Za-z0-9’'-]+/g)||[]).length;
/* Cambridge-style estimate: raw % → scale (approximate, for practice only) */
function toScale(p){if(p>=80)return Math.round(180+(p-80)/20*10);if(p>=60)return Math.round(160+(p-60));if(p>=40)return Math.round(140+(p-40));return Math.round(102+p/40*38);}
function level(s){return s>=180?'C1':s>=160?'B2':s>=140?'B1':s>=120?'A2':'A2 以下';}
const LVCOL={C1:'g',B2:'g',B1:'y',A2:'r','A2 以下':'r'};
function lvPill(s){const l=level(s);return `<span class="pill ${LVCOL[l]}">程度 ${l}</span>`;}
/* count fully-correct and partly-correct questions in given parts */
function qCount(P,r,f){let ok=0,half=0,n=0;P.parts.forEach((p,pi)=>{if(f&&!f(p))return;const max=p.type==='kwt'?2:(p.marks||1);r.parts[pi].each.forEach(g=>{n++;if(g===max)ok++;else if(g>0)half++;});});return {ok,half,n};}
function scoreCard(title,scale,raw,q){const zero=raw[0]===0;
  return `<div class="card"><div class="small">${title}</div><div class="bigscore" style="${zero?'color:var(--red)':''}">${zero?'未得分':scale}</div>
  <div style="margin-top:6px;font-weight:700">答對 ${q.ok} / ${q.n} 題${q.half?`（另有 ${q.half} 題拿部分分數）`:''}</div>
  <div class="small">得分 ${raw[0]} / ${raw[1]} 分</div><div style="margin-top:6px">${zero?'<span class="pill r">這部分沒有拿到分數</span>':lvPill(scale)}</div></div>`;}
const SCALE_NOTE='<p class="small">分數是依「得分比例」換算的估算：得分 40% ≈ 140（B1）、60% ≈ 160（B2 及格）、80% ≈ 180（C1）。有些題目 1 分、有些 2 分，所以「答對題數」和「得分」會不一樣。</p>';
function grade(s){return s>=180?'Grade A（C1）':s>=173?'Grade B（B2）':s>=160?'Grade C（B2）':s>=140?'Level B1':'未達 B1';}
const CAND=()=>store.get('name','');

/* ================= exam content (original practice material) ================= */
/* ===== shared instructions (B2 First for Schools format). {R} = question range ===== */
const RU_META={
 1:{type:'mcCloze',marks:1,instr:'For questions {R}, read the text below and decide which answer (A, B, C or D) best fits each gap.',zh:'讀短文，每個空格選出最適合的 A、B、C 或 D。每題 1 分。'},
 2:{type:'open',marks:1,instr:'For questions {R}, read the text below and think of the word which best fits each gap. Use only one word in each gap.',zh:'每個空格只填一個字。每題 1 分。'},
 3:{type:'wf',marks:1,instr:'For questions {R}, read the text below. Use the word given in capitals at the end of some of the lines to form a word that fits in the gap in the same line.',zh:'用括號裡的大寫字變化成適合的字。每題 1 分。'},
 4:{type:'kwt',marks:2,instr:'For questions {R}, complete the second sentence so that it has a similar meaning to the first sentence, using the word given. Do not change the word given. You must use between two and five words, including the word given.',zh:'用框框裡的字（不可改變）完成第二句，意思和第一句相同，填 2–5 個字。每題 2 分，可得部分分數。'},
 5:{type:'mc',marks:2,instr:'You are going to read an article. For questions {R}, choose the answer (A, B, C or D) which you think fits best according to the text.',zh:'閱讀文章，依照文章內容選出最適合的答案。每題 2 分。'},
 6:{type:'gapped',marks:2,instr:'You are going to read an article. Six sentences have been removed from the article. Choose from the sentences A–G the one which fits each gap ({R}). There is one extra sentence which you do not need to use.',zh:'把句子 A–G 放回文章的空格，有一句用不到。每題 2 分。'},
 7:{type:'match',marks:1,instr:'You are going to read about four young people. For questions {R}, choose from the people (A–D). The people may be chosen more than once.',zh:'閱讀四個人的介紹，判斷每題說的是誰。同一個人可以選不只一次。每題 1 分。'}
};
const LI_META={
 1:{type:'lmc',instr:'You will hear people talking in eight different situations. For questions {R}, choose the best answer (A, B or C).',zh:'聽八段不同情境的對話，選出最適合的答案。每段播 2 次，先讀題目再播放。'},
 2:{type:'gapfill',instr:'You will hear a talk. For questions {R}, complete the sentences with a word or short phrase.',zh:'聽一段介紹，用一個字或短語完成句子。整段播 2 次。'},
 3:{type:'lmatch',instr:'You will hear five young people talking. For questions {R}, choose from the list (A–H) what each speaker says. Use the letters only once. There are three extra letters which you do not need to use.',zh:'聽五個人說話，從 A–H 選出每個人說的。每個字母只能用一次，有三個用不到。'},
 4:{type:'lmc',shared:true,instr:'You will hear an interview. For questions {R}, choose the best answer (A, B or C).',zh:'聽一段訪問，選出最適合的答案。整段播 2 次。'}
};

const SETS={};
/* ===================== SET 1 ===================== */
SETS[1]={
ruoe:[
 {part:1,title:"The Mystery of Sleep",
  text:"Scientists have long been interested in why we sleep. Although we spend about a third of our lives asleep, researchers are still trying to {1} the mystery of what happens in our brains at night. One popular {2} is that sleep helps the brain to store new information. Studies have shown that students who sleep well before an exam tend to {3} better than those who stay up late revising. Sleep also plays an important {4} in keeping us healthy: without enough rest, our bodies find it harder to {5} off illnesses such as colds. Teenagers need between eight and ten hours a night, but many of them {6} to get this amount because of homework and screens. As a result, they often feel tired at school and find it hard to {7} on their lessons. Experts suggest switching off phones an hour before bed. It may sound simple, but it can make a real {8} to how we feel the next day.",
  items:[
   {n:1,o:["solve","answer","repair","fix"],a:0,e:"solve a mystery（解開謎團）是固定搭配。answer 是回答問題，repair/fix 是修理東西。"},
   {n:2,o:["theory","reason","method","cause"],a:0,e:"One popular theory is that…（一個常見的理論是…）。reason/cause 是原因，後面不會接「…是說」。"},
   {n:3,o:["perform","act","succeed","achieve"],a:0,e:"perform better（表現得比較好）。succeed 和 achieve 不能直接接 better。"},
   {n:4,o:["duty","role","job","work"],a:1,e:"play an important role（扮演重要角色）是固定搭配。"},
   {n:5,o:["beat","hit","fight","push"],a:2,e:"fight off an illness（抵抗疾病）。beat 後面不接 off。"},
   {n:6,o:["miss","lack","lose","fail"],a:3,e:"fail to do something（沒能做到）。lack 後面直接接名詞，不接 to。"},
   {n:7,o:["attend","concentrate","notice","listen"],a:1,e:"concentrate on（專心於）。listen 要接 to，notice 後面直接接東西。"},
   {n:8,o:["effect","result","difference","influence"],a:2,e:"make a difference to（對…產生影響/差別）是固定搭配。effect 要用 have an effect on。"}]},
 {part:2,title:"A School Without Plastic",
  text:"When our head teacher announced that our school would become plastic-free, most of us thought it would be impossible. After {9}, plastic seemed to be everywhere – in our lunch boxes, our pens and even our uniforms. However, {10} took only a few months to make a real change. The first step was to get rid {11} plastic bottles. Every student was given a metal one, {12} could be refilled at new water fountains. Then the school canteen stopped using plastic forks and spoons. Some students complained at first, but {13} the end of the term, almost everyone agreed it was a good idea. Our school is now {14} of the cleanest in the city, and other schools have asked us {15} advice. I'm proud that we have shown how much difference a small group of people {16} make.",
  items:[
   {n:9,a:["all"],e:"After all（畢竟）是固定說法。"},
   {n:10,a:["it"],e:"it took + 時間 + to do（花了多少時間做）。"},
   {n:11,a:["of"],e:"get rid of（擺脫、丟掉）。"},
   {n:12,a:["which"],e:"指 a metal one（水壺），逗號後面要用 which，不能用 that。"},
   {n:13,a:["by","at"],e:"by the end of the term（到學期結束時）。at the end of 也可以。"},
   {n:14,a:["one"],e:"one of the + 最高級 + 複數名詞（最…之一）。"},
   {n:15,a:["for"],e:"ask somebody for advice（向某人請教）。"},
   {n:16,a:["can","could"],e:"how much difference people can make（人能帶來多大的改變）。"}]},
 {part:3,title:"Learning to Code",
  text:"Coding used to be seen as a skill only for {17}, but today it is taught in many primary schools. Supporters say it improves children's {18} and teaches them to solve problems {19}. When young people write a program, they quickly see the {20} between their instructions and what happens on the screen. Making mistakes is a normal part of the process, so pupils also learn {21}. Some parents worry that children already spend too much time in front of screens, and this is {22}. However, most teachers believe that coding lessons are {23} valuable, since many future {24} will expect basic digital skills.",
  items:[
   {n:17,stem:"SCIENCE",a:["scientists"],e:"a skill only for ___（只給某種人）→ 人，複數 scientists。"},
   {n:18,stem:"CREATE",a:["creativity"],e:"children's ___ 後面要名詞 → creativity（創造力）。"},
   {n:19,stem:"LOGIC",a:["logically"],e:"修飾動詞 solve → 副詞 logically。"},
   {n:20,stem:"CONNECT",a:["connection","connections"],e:"the ___ between A and B → 名詞 connection（關聯）。"},
   {n:21,stem:"PATIENT",a:["patience"],e:"learn ___ → 名詞 patience（耐心）。"},
   {n:22,stem:"UNDERSTAND",a:["understandable"],e:"this is ___ → 形容詞 understandable（可以理解的）。"},

 {part:4,
  items:[
   {n:25,s1:"It was such a boring film that I fell asleep.",key:"SO",s2:"The film ____ I fell asleep.",chunks:[["was so boring"],["that"]],full:"was so boring that",e:"such a + 形容詞 + 名詞 that = so + 形容詞 + that。was so boring（1 分）＋ that（1 分）。"},
   {n:26,s1:"I'd prefer to stay at home tonight.",key:"RATHER",s2:"I ____ at home tonight.",chunks:[["would rather","'d rather"],["stay"]],full:"would rather stay",e:"would prefer to = would rather + 原形動詞（不加 to）。"},
   {n:27,s1:"They are building a new sports centre in our town.",key:"BEING",s2:"A new sports centre ____ in our town.",chunks:[["is being"],["built"]],full:"is being built",e:"現在進行式的被動：is being + 過去分詞 built。"},
   {n:28,s1:"Lucy didn't go to the party because she was ill.",key:"IF",s2:"Lucy would have gone to the party ____ ill.",chunks:[["if she"],["hadn't been","had not been"]],full:"if she hadn't been",e:"第三類條件句（和過去事實相反）：if + had not + 過去分詞。"},
   {n:29,s1:"'Where do you live?' Tom asked me.",key:"WHERE",s2:"Tom asked me ____.",chunks:[["where i"],["lived"]],full:"where I lived",e:"轉述問句：語順變成「主詞＋動詞」，而且時態往前一格 live → lived。"},
   {n:30,s1:"It's not worth watching that programme.",key:"POINT",s2:"There's ____ that programme.",chunks:[["no point"],["watching","in watching"]],full:"no point in watching",e:"There's no point (in) + V-ing（做…沒有意義）。"}]},
 {part:5,title:"Learning to Sail",
  passage:["When my uncle offered to teach me to sail last summer, I almost said no. I had never been a confident swimmer, and the idea of being in a small boat on open water made my stomach turn. But my uncle, who has been sailing since he was a boy, promised that we would stay close to the shore until I felt ready. 'The sea is only frightening when you don't understand it,' he told me.",
   "The first lesson was not what I expected. Instead of getting into the boat, we spent a whole morning on the beach, tying knots and learning the names of every rope and sail. I remember feeling impatient; I wanted to be out on the water, not sitting on the sand. Only later did I realise why my uncle had insisted on this. When the wind suddenly changes, there is no time to think about which rope to pull.",
   "On my third day, the wind picked up just as we were turning back towards the harbour. Waves splashed over the side, and for a moment I froze. My uncle didn't take the controls from me. He simply said, calmly, 'Let the sail out a little.' I did, and the boat steadied almost immediately. I was shaking, but I had done it myself.",
   "By the end of the summer, I was sailing alone in the bay while my uncle watched from the beach. What surprised me most was not that I had learned a new skill, but how differently I felt about the sea. It no longer seemed like an enemy. It was more like a powerful friend that needed to be respected.",
   "I still wouldn't call myself a brave person. But I have learned that fear is often just a sign that you don't yet know enough. Next summer, I'm hoping to enter the junior race at the local sailing club – something I could never have imagined a year ago."],
  items:[
   {n:31,q:"Why did the writer nearly refuse her uncle's offer?",o:["She had already made other plans.","She felt nervous about being on the sea.","She did not think her uncle was a good teacher.","She thought sailing would be boring."],a:1,e:"第 1 段：她游泳不好，想到在小船上就 made my stomach turn（很緊張）→ B。"},
   {n:32,q:"What does the phrase 'made my stomach turn' in paragraph 1 suggest?",o:["She felt ill because of something she ate.","The idea made her feel anxious.","She was excited about the trip.","She was hungry."],a:1,e:"made my stomach turn = 讓人很不舒服、很緊張，這裡指想到出海就害怕 → B。"},
   {n:33,q:"How did the writer feel during the first lesson?",o:["frustrated that they stayed on land","confused by the instructions","proud of how quickly she learned","worried about the weather"],a:0,e:"第 2 段：I remember feeling impatient; I wanted to be out on the water → 不耐煩一直待在岸上 → A。"},
   {n:34,q:"What does the writer say about her third day?",o:["Her uncle had to take control of the boat.","She dealt with a difficult moment with a little advice.","The weather forced them to stay in the harbour.","She decided she did not want to continue."],a:1,e:"第 3 段：叔叔沒有接手，只說 Let the sail out a little，她自己做到了 → B。陷阱 A：文中說 didn't take the controls。"},
   {n:35,q:"What surprised the writer most by the end of the summer?",o:["how quickly she could sail alone","the change in her feelings about the sea","how much her uncle trusted her","how strong the wind could be"],a:1,e:"第 4 段：What surprised me most was not… but how differently I felt about the sea → B。陷阱 A：not that I had learned a new skill。"},
   {n:36,q:"What is the writer's main point in the final paragraph?",o:["Brave people never feel afraid.","Knowing more can help you overcome fear.","Racing is more enjoyable than sailing alone.","She wants to become a sailing teacher."],a:1,e:"fear is often just a sign that you don't yet know enough → 知道得更多就能克服害怕 → B。"}]},
 {part:6,title:"The Secret Life of Octopuses",
  passage:["Octopuses are some of the most intelligent animals in the ocean. They have been observed using tools, solving puzzles and even escaping from aquarium tanks. {37}",
   "One reason for their intelligence may be the way their nervous system is organised. An octopus has around 500 million nerve cells, but most of these are not in its head. {38} This means each arm can taste, touch and even make simple decisions without waiting for instructions from the brain.",
   "Octopuses are also masters of disguise. Special cells in their skin allow them to change colour in less than a second. {39} Some species can even change the texture of their skin, making it look rough like a rock or soft like seaweed.",
   "Scientists have recorded many examples of octopuses behaving in surprisingly clever ways. In one aquarium in New Zealand, an octopus named Inky squeezed through a small gap in his tank, crossed the floor and escaped down a pipe into the sea. {40}",
   "Despite their intelligence, octopuses live surprisingly short lives. {41} This makes their ability to learn so quickly even more remarkable, as they have very little time to gain experience.",
   "Researchers hope that studying octopuses will help us understand how intelligence develops in creatures very different from ourselves. {42} After all, if a creature with eight arms and no bones can be so clever, intelligence may be far more common in nature than we once believed."],
  sents:{A:"Instead, they are spread throughout its eight arms.",B:"They use this ability both to hide from enemies and to surprise their prey.",C:"Most species survive for only one or two years.",D:"Staff only realised what had happened when they found the tank empty the next morning.",E:"In fact, some experts believe they may be as clever as some mammals.",F:"Their findings could change the way we think about other animals too.",G:"Octopuses are closely related to fish and share many of their abilities."},
  items:[
   {n:37,a:"E",e:"前面列出牠們很聰明的例子，接著 In fact… as clever as some mammals 再加強 → E。"},
   {n:38,a:"A",e:"前一句說神經細胞「不在頭裡」，Instead 說明在哪裡（八隻手臂）；後一句 each arm can taste… → A。"},
   {n:39,a:"B",e:"前一句說能在一秒內變色，this ability 指變色能力 → B。"},
   {n:40,a:"D",e:"講 Inky 逃跑的故事，接著說工作人員隔天才發現 → D。"},
   {n:41,a:"C",e:"前一句說壽命很短，C 給出具體年數；後一句 very little time 呼應 → C。"},
   {n:42,a:"F",e:"Researchers hope… 後面接 Their findings（他們的研究發現）→ F。G 是錯的：章魚不是魚的近親，用不到。"}]},
 {part:7,
  texts:[
   {id:"A",name:"Lena",t:"I spent two weeks living with a family in Valencia in Spain. Before I left, I was worried that my Spanish wasn't good enough, but my host family were so patient that I soon stopped worrying about mistakes. The food was a big surprise – dinner wasn't served until ten o'clock at night! The hardest part was saying goodbye. I still message my host sister every week."},
   {id:"B",name:"Omar",t:"Japan had always been my dream destination, so I applied for the exchange the moment it was announced. School there was much stricter than I'd expected – we even had to clean the classrooms ourselves at the end of the day. At first I found it strange, but now I think it's a great idea. I've started helping more at home since I got back, which my parents are very happy about."},
   {id:"C",name:"Maya",t:"Because Canada is an English-speaking country, I assumed the trip would be easy. I was wrong! Everyone spoke so fast that I understood very little in the first few days. What helped most was joining the school's basketball team – sport is a language everyone understands. I'd love to go back and study there when I'm older."},
   {id:"D",name:"Ethan",t:"To be honest, I only signed up for the exchange to Germany because my best friend was going. Then, a week before we left, he broke his leg and couldn't come. I was nervous about travelling without him, but it turned out to be the best thing that could have happened. Without him, I was forced to talk to new people, and I made friends from all over the world."}],
  items:[
   {n:43,q:"has changed a habit since returning home?",a:"B",e:"Omar：I've started helping more at home since I got back。"},
   {n:44,q:"was surprised by the time of a meal?",a:"A",e:"Lena：dinner wasn't served until ten o'clock at night!"},
   {n:45,q:"found that an activity helped them to communicate?",a:"C",e:"Maya：joining the basketball team – sport is a language everyone understands。"},
   {n:46,q:"decided to take part mainly because of a friend?",a:"D",e:"Ethan：I only signed up… because my best friend was going。"},
   {n:47,q:"was concerned about their language level before the trip?",a:"A",e:"Lena：I was worried that my Spanish wasn't good enough。陷阱 C：Maya 是以為會很簡單，不是擔心。"},
   {n:48,q:"is still in regular contact with someone they met?",a:"A",e:"Lena：I still message my host sister every week。"},
   {n:49,q:"now thinks positively about something they first found strange?",a:"B",e:"Omar：打掃教室 At first I found it strange, but now I think it's a great idea。"},
   {n:50,q:"had expected the experience to be easier than it was?",a:"C",e:"Maya：I assumed the trip would be easy. I was wrong!"},
   {n:51,q:"would like to study in that country in the future?",a:"C",e:"Maya：I'd love to go back and study there when I'm older。"},
   {n:52,q:"benefited from an unexpected change of plan?",a:"D",e:"Ethan：朋友摔斷腿不能去，結果 it turned out to be the best thing。"}]}

lis:[
 {part:1,items:[
   {n:1,q:"You hear a girl talking about her new phone. What does she dislike about it?",o:["its size","its battery","its camera"],a:1,s:[["G","Everyone told me the camera on this phone was amazing, and they were right – my photos look brilliant. It fits nicely in my pocket, too."],["G","My only complaint is that I have to charge it twice a day, which is a real pain."]],e:"每天要充兩次電，是電池的問題 → B。相機和大小她都很滿意。"},
   {n:2,q:"You hear a boy talking to his teacher. Why did he miss the class trip?",o:["He was ill.","He forgot to bring a form.","His family went away."],a:1,s:[["B","I'm really sorry I wasn't on the coach yesterday, Miss Hall. I wasn't sick or anything – I just left the permission form on the kitchen table, so they wouldn't let me go."],["W","Oh, that's a shame. Never mind, there'll be another trip next term."]],e:"同意書忘在廚房桌上 → B。陷阱 A：他說 I wasn't sick。"},
   {n:3,q:"You hear a woman on the radio talking about a new museum. What is special about it?",o:["Visitors can touch the objects.","It stays open all night.","Entry is free for students."],a:0,s:[["W","The new science museum opens this Saturday. Tickets are twelve pounds for adults, and students pay half price."],["W","But what makes it different from other museums is that nothing is behind glass – you're encouraged to pick things up and experiment with them."]],e:"nothing is behind glass… pick things up → 可以摸展品 → A。陷阱 C：學生是半價，不是免費。"},
   {n:4,q:"You hear two friends talking about a film. What do they agree about?",o:["The story was confusing.","The music was excellent.","The film was too long."],a:1,s:[["G","I thought the ending was a bit confusing, didn't you?"],["B","Not really, it made sense to me. But the soundtrack – wow!"],["G","I know! I've been listening to it all morning."]],e:"兩人都覺得配樂很棒 → B。結局的部分他們意見不同。"},
   {n:5,q:"You hear a boy talking about a piano concert. How did he feel afterwards?",o:["disappointed","bored","proud"],a:2,s:[["B","I'd been practising that piece for months. When I finished without a single mistake, I felt so pleased with myself."],["B","I didn't win a prize, but that didn't matter at all. My teacher said it was the best I'd ever played."]],e:"pleased with myself = 對自己很滿意、驕傲 → C。陷阱 A：沒得獎但他說 didn't matter at all。"},
   {n:6,q:"You hear a girl leaving a voice message. What does she want her friend to do?",o:["bring a book","call her back","meet her earlier"],a:1,s:[["G","Hi Tom, it's Ana. I'm at the library now, so don't worry about bringing that book – I've already found a copy."],["G","Can you ring me when you get this? I need to ask you something about the homework."]],e:"Can you ring me = 回電話給我 → B。陷阱 A：她說不用帶書了。"},
   {n:7,q:"You hear a man talking to a group of students. Where are they?",o:["at a zoo","in a forest","on a farm"],a:1,s:[["M","Right, everyone, stay on the path, please. In a moment you'll see the oldest tree in the park – it's over three hundred years old."],["M","And keep your eyes open. There are deer living among these trees, and if we're quiet, we might spot one."]],e:"小路、老樹、樹林裡的鹿 → 森林 B。"},
   {n:8,q:"You hear a boy talking about learning Korean. What does he find most difficult?",o:["remembering vocabulary","understanding native speakers","writing correctly"],a:1,s:[["B","Learning new words is actually quite fun – I use an app for that. And my written work usually gets good marks."],["B","But when I watch videos made by people from Korea, they speak so fast that I can hardly follow anything."]],e:"韓國人說話太快聽不懂 → B。單字和寫作他都說沒問題。"}]},
 {part:2,
  s:[["G","Hi everyone, I'm Zoe, and I want to tell you about our rooftop garden project. It all started two years ago, when our science teacher, Mr Patel, noticed that the school roof was completely empty. He thought it would be the perfect place to grow food."],
     ["G","At first, there were only six of us in the gardening club, but now we have over forty members. We grow lots of different things, but our biggest success has been tomatoes. Last summer we picked so many that the school kitchen used them in soup for a whole week. We tried growing carrots too, but they didn't do well because the soil on the roof isn't deep enough."],
     ["G","Of course, there have been problems. The biggest one has been the wind, which is much stronger on the roof than at ground level. We had to build wooden walls around the beds to protect the plants. Birds were also a nuisance at first, but we solved that with some old CDs hanging from strings – the light scares them away."],
     ["G","Every Friday afternoon, we sell some of our vegetables to parents at the school gate. So far we've raised about three hundred pounds, and we're going to use the money to buy a small greenhouse."],
     ["G","Next term, we're planning to start keeping bees on the roof. A local beekeeper has offered to help us. And if all goes well, we'd like to enter the city's young gardeners competition in June."]],
  items:[
   {n:9,before:"The idea for the garden came from the school's",after:"teacher.",a:["science"],e:"our science teacher, Mr Patel, noticed…"},
   {n:10,before:"The gardening club now has more than",after:"members.",a:["forty","40"],e:"now we have over forty members。陷阱：six 是一開始的人數。"},
   {n:11,before:"The most successful plants have been the",after:".",a:["tomatoes","tomato"],e:"our biggest success has been tomatoes。"},
   {n:12,before:"Carrots did not grow well because the",after:"was not deep enough.",a:["soil"],e:"the soil on the roof isn't deep enough。"},
   {n:13,before:"The biggest problem on the roof has been the",after:".",a:["wind","strong wind","the wind"],e:"The biggest one has been the wind。陷阱：birds 只是一開始的小麻煩。"},
   {n:14,before:"To keep birds away, the students hung old",after:"from strings.",a:["cds","cd","compact discs"],e:"some old CDs hanging from strings。"},
   {n:15,before:"Vegetables are sold to parents every",after:"afternoon.",a:["friday"],e:"Every Friday afternoon, we sell some of our vegetables。"},
   {n:16,before:"The money will be used to buy a small",after:".",a:["greenhouse"],e:"use the money to buy a small greenhouse。"},
   {n:17,before:"Next term, the club plans to start keeping",after:".",a:["bees"],e:"start keeping bees on the roof。"},
   {n:18,before:"The club would like to enter a competition in",after:".",a:["june"],e:"the young gardeners competition in June。"}]},
 {part:3,
  opts:{A:"They wanted to become more confident.",B:"A family member encouraged them.",C:"They hope it will help them in a future job.",D:"Their friends were already members.",E:"They wanted to try something completely new.",F:"It fitted in well with their timetable.",G:"They wanted to get fitter.",H:"A teacher suggested it."},
  items:[
   {n:19,sp:"Speaker 1",s:[["G","I joined the drama club at the start of the year. My friends all thought I was mad – none of them would ever go on stage! But I've always been really shy, and I thought performing might help me feel more comfortable speaking in front of people. It's already working."]],a:"A",e:"很害羞，想讓自己在人前說話更自在 → 變得更有自信 A。陷阱 D：朋友都不參加。"},
   {n:20,sp:"Speaker 2",s:[["B","I'm in the chess club. I'd never played before, to be honest – I'd always done sports clubs like football and swimming. I just fancied doing something totally different, something that used my brain instead of my legs!"]],a:"E",e:"something totally different → 想嘗試全新的東西 E。陷阱 G：運動是他以前做的。"},
   {n:21,sp:"Speaker 3",s:[["G","My mum's a journalist, and she's always telling me how exciting her job is, but that's not why I joined the school newspaper. Ms Rivera, my English teacher, read one of my stories and said I should write for it. I wasn't sure at first, but I'm so glad I listened."]],a:"H",e:"英文老師說她應該加入 → H。陷阱 B：她特別說媽媽 not why I joined。"},
   {n:22,sp:"Speaker 4",s:[["B","I joined the coding club because I'm hoping to become a games designer one day. Lots of people think it's just for fun, but you learn really useful skills. It's on Wednesday lunchtimes, which is a bit annoying, because that's when I usually see my friends."]],a:"C",e:"想以後當遊戲設計師 → 對未來工作有幫助 C。陷阱 F：時間其實不太方便。"},
   {n:23,sp:"Speaker 5",s:[["G","I'd put on a bit of weight over the holidays, and I wanted to get back in shape, so I joined the dance club. My older brother laughed at me, but I don't care – it's brilliant exercise, and the music is great."]],a:"G",e:"get back in shape、brilliant exercise → 想變健康 G。陷阱 B：哥哥是取笑她，不是鼓勵。"}]},
 {part:4,
  s:[["W","My guest today is fifteen-year-old Mia Cole, whose first novel came out last month. Mia, when did you start writing?"],
     ["G","I've always made up stories, but I only started writing them down when I was eleven. We'd just moved house, and I didn't know anyone at my new school, so I spent a lot of time on my own. Writing was a way of making friends – even if they were imaginary!"],
     ["W","Where did the idea for your novel come from?"],
     ["G","People always assume it's based on my own life, but it isn't really. The idea came from a dream I had about a city floating in the sky. I woke up and wrote down everything I could remember before I forgot it."],
     ["W","How long did it take you to write?"],
     ["G","The first draft took about eight months, which was quick. But then I rewrote it three times. The rewriting was much harder than the writing – I had to cut out some of my favourite chapters because they slowed the story down."],
     ["W","How did you find a publisher?"],
     ["G","My aunt works in a bookshop, and everyone thinks she helped me, but actually I entered a national writing competition. I didn't win, but one of the judges was an editor, and she contacted me afterwards."],
     ["W","How do you manage writing and schoolwork?"],
     ["G","It isn't easy. I write for an hour every morning before school, when the house is quiet. At weekends I try not to write at all – I think your brain needs a rest."],
     ["W","What do your friends think about your success?"],
     ["G","They're really supportive, though some of them were surprised. I'd never told anyone at school I was writing a book! Now they keep asking if they're going to appear in the next one."],
     ["W","Finally, what advice would you give young writers?"],
     ["G","Read as much as you can – that's what everyone says, and it's true. But my main advice is: don't show your work to anyone until it's finished. If people criticise it too early, you might give up."]],
  items:[
   {n:24,q:"Why did Mia start writing her stories down?",o:["Her teacher asked her to.","She felt lonely after moving house.","She wanted to become famous."],a:1,e:"剛搬家、在新學校誰都不認識，常常一個人 → B。"},
   {n:25,q:"Where did the idea for her novel come from?",o:["her own experiences","a book she had read","a dream she had"],a:2,e:"The idea came from a dream → C。陷阱 A：她說 it isn't really（不是自己的生活）。"},
   {n:26,q:"What did Mia find hardest?",o:["finding time to write","removing parts she liked","writing the first draft"],a:1,e:"改寫比較難，要刪掉喜歡的章節 → B。陷阱 C：初稿 was quick。"},
   {n:27,q:"How did Mia find a publisher?",o:["Her aunt introduced her to one.","She won a competition.","A judge contacted her."],a:2,e:"比賽沒得獎，但評審之一是編輯，之後聯絡她 → C。"},
   {n:28,q:"When does Mia usually write?",o:["early in the morning","late at night","at weekends"],a:0,e:"every morning before school → A。陷阱 C：週末她 try not to write。"},
   {n:29,q:"How did Mia's friends react to her success?",o:["Some of them were jealous.","Some of them had not known about the book.","They wanted to write books too."],a:1,e:"I'd never told anyone at school → 有些朋友不知道她在寫書 → B。"},
   {n:30,q:"What is Mia's main advice for young writers?",o:["Read as many books as possible.","Keep your writing private until it is finished.","Ask friends for their opinions."],a:1,e:"my main advice is: don't show your work to anyone until it's finished → B。陷阱 A：那是 what everyone says。"}]}

 {part:1,title:"The Story of Chocolate",
  text:"Chocolate is one of the world's most popular treats, but it has not always been eaten as a sweet. For thousands of years, people in Central America made a bitter drink from cocoa beans, which they believed had special powers. The beans were {1} so highly that they were even used as money. When the Spanish {2} cocoa to Europe in the sixteenth century, it quickly {3} on among wealthy people, who added sugar to make it sweeter. However, it was not until the 1840s that a British company {4} up with the idea of making solid chocolate bars. Today, the chocolate industry is {5} billions of dollars a year. Yet many cocoa farmers, most of whom live in West Africa, earn very little. Some companies have now {6} to pay farmers fairer prices, and more shoppers are choosing chocolate with a 'fair trade' label. So next time you {7} yourself to a bar of chocolate, it might be worth {8} a moment to think about where it came from.",
  items:[
   {n:1,o:["valued","priced","charged","cost"],a:0,e:"be valued highly（被高度重視、珍視）。priced/charged/cost 都和「定價、收費」有關，不能接 so highly。"},
   {n:2,o:["introduced","presented","delivered","showed"],a:0,e:"introduce something to a place（把…引進某地）。"},
   {n:3,o:["caught","took","picked","got"],a:0,e:"catch on（流行起來），過去式 caught on。"},
   {n:4,o:["came","thought","made","put"],a:0,e:"come up with an idea（想出一個點子），過去式 came up with。"},
   {n:5,o:["worth","valued","priced","cost"],a:0,e:"be worth + 金額（值…錢）。valued 後面要加 at。"},
   {n:6,o:["promised","assured","ensured","insisted"],a:0,e:"promise to do（承諾去做）。insist 要用 insist on doing。"},
   {n:7,o:["treat","give","offer","serve"],a:0,e:"treat yourself to something（犒賞自己…）是固定說法。"},
   {n:8,o:["taking","passing","keeping","holding"],a:0,e:"take a moment（花一點時間）。worth 後面接 V-ing → taking。"}]},
 {part:2,title:"Why Do Cats Purr?",
  text:"Most people think that cats purr only {9} they are happy, but scientists have discovered that the truth is more complicated. Cats also purr when they are hurt or frightened. Some researchers believe that purring may help cats to heal, {10} the vibrations are thought to strengthen their bones. {11} is more, cats seem to use a special kind of purr when they want food. This sound includes a high-pitched cry, similar {12} that of a human baby, which makes it very difficult for owners to ignore. In one study, people were asked to listen to recordings of different purrs. Even those {13} had never owned a cat could tell which purrs were requests for food. {14} cats have lived with humans for thousands of years, there is still a great deal we do not know {15} them. Perhaps that is part of the reason {16} they remain so popular.",
  items:[
   {n:9,a:["when","if"],e:"purr only when they are happy（只在開心時發出呼嚕聲）。if 也可以。"},
   {n:10,a:["as","because","since"],e:"表示原因的連接詞：as / because / since。"},
   {n:11,a:["what"],e:"What is more（而且、更重要的是）是固定說法。"},
   {n:12,a:["to"],e:"similar to（和…相似）。"},
   {n:13,a:["who","that"],e:"those who…（那些…的人）。"},
   {n:14,a:["although","though","while","whilst"],e:"雖然貓和人類一起生活了幾千年，但… → Although / Though / While。"},
   {n:15,a:["about"],e:"know about something（了解…）。"},
   {n:16,a:["why","that"],e:"the reason why…（…的原因）。"}]},
 {part:3,title:"Becoming a Vet",
  text:"Many children dream of becoming a vet, but the job is far more {17} than most people imagine. Vets need a wide {18} of different animals, from tiny hamsters to enormous horses. The training is long and {19}, and many students have to borrow money to pay for it. Dealing with worried pet owners also requires great {20}. Working hours can be {21}, as animals often fall ill in the middle of the night. {22}, some animals cannot be saved, which can be emotionally {23} for everyone involved. Despite all this, most vets say their work is {24} rewarding.",
  items:[
   {n:17,stem:"DEMAND",a:["demanding"],e:"far more ___ than…（比…更…）→ 形容詞 demanding（要求很高的、辛苦的）。"},
   {n:18,stem:"KNOW",a:["knowledge"],e:"a wide ___ of → 名詞 knowledge（知識）。"},
   {n:19,stem:"EXPENSE",a:["expensive"],e:"long and ___ → 形容詞 expensive（後面說要借錢）。"},
   {n:20,stem:"SENSITIVE",a:["sensitivity"],e:"requires great ___ → 名詞 sensitivity（體貼、細心）。"},
   {n:21,stem:"PREDICT",a:["unpredictable"],e:"動物半夜會生病 → 時間「無法預測」→ un + predict + able。"},
   {n:22,stem:"FORTUNE",a:["unfortunately"],e:"有些動物救不回來 → 「不幸地」→ Unfortunately。"},
   {n:23,stem:"EXHAUST",a:["exhausting"],e:"情緒上「讓人筋疲力盡的」→ exhausting（-ing 是「讓人覺得」）。"},
   {n:24,stem:"INCREDIBLE",a:["incredibly"],e:"修飾形容詞 rewarding → 副詞 incredibly。"}]},
 {part:4,
  items:[
   {n:25,s1:"I last went swimming three months ago.",key:"FOR",s2:"I ____ three months.",chunks:[["haven't","have not"],["been swimming for","swum for"]],full:"haven't been swimming for",e:"最後一次是三個月前 = 三個月沒…了 → 現在完成式 haven't been swimming / haven't swum for。"},
   {n:26,s1:"My brother is too young to drive a car.",key:"OLD",s2:"My brother is ____ to drive a car.",chunks:[["not"],["old enough"]],full:"not old enough",e:"too young = not old enough。enough 放在形容詞後面。"},
   {n:27,s1:"Someone has stolen my bag!",key:"BEEN",s2:"My bag ____!",chunks:[["has been"],["stolen"]],full:"has been stolen",e:"現在完成式的被動：has been + 過去分詞 stolen。"},
   {n:28,s1:"You should take an umbrella in case it rains.",key:"BETTER",s2:"You ____ an umbrella in case it rains.",chunks:[["had better","'d better"],["take"]],full:"had better take",e:"should = had better + 原形動詞（不加 to）。"},
   {n:29,s1:"Jack regrets not studying harder.",key:"WISHES",s2:"Jack ____ harder.",chunks:[["wishes he"],["had studied","'d studied"]],full:"wishes he had studied",e:"後悔過去的事 → wish + had + 過去分詞。"},
   {n:30,s1:"It took me two hours to finish the project.",key:"SPENT",s2:"I ____ the project.",chunks:[["spent two hours"],["finishing","on","doing"]],full:"spent two hours finishing",e:"spend + 時間 + V-ing / on something。"}]},
 {part:5,title:"My Great-Grandmother's Recipe Book",
  passage:["Every summer, I spend a few weeks with my grandmother in her small house by the sea. Last year, while I was looking for a torch in her kitchen cupboard, I came across an old notebook with a faded red cover. Inside were dozens of handwritten recipes, some in my grandmother's neat writing and others in a style I didn't recognise.",
   "When I showed it to her, she went quiet for a moment. 'That belonged to my mother,' she said eventually. 'I thought it had been lost years ago.' She explained that her mother had been a cook in a large hotel and had collected recipes from guests who came from all over the world. Some of the pages had notes in the margins – 'too much salt!' or 'Mr Brown's favourite'.",
   "My grandmother suggested we cook one recipe from the book every day. I wasn't especially keen at first. I'd never cooked anything more complicated than toast, and some of the dishes had ingredients I'd never heard of. But my grandmother was patient, and she let me make my own mistakes. My first attempt at bread was as hard as a brick, and we laughed about it for days.",
   "As the weeks went by, I realised that cooking was only part of what we were doing. While we chopped and stirred, my grandmother told me stories about her childhood that I had never heard before – about the hotel, the guests and her mother, who sounded like a remarkable woman. The recipes became a way of getting to know a member of my family I had never met.",
   "When I got home, I typed up all the recipes and made a copy for each of my cousins. My grandmother kept the original, of course. Now, whenever I make one of the dishes, I feel connected to two generations of women in my family – and, I like to think, to some of those hotel guests too."],
  items:[
   {n:31,q:"How did the writer find the notebook?",o:["Her grandmother gave it to her.","She found it by chance.","She had been searching for it.","A cousin showed it to her."],a:1,e:"第 1 段：找手電筒時 came across（偶然發現）→ B。"},
   {n:32,q:"How did the grandmother react when she saw the notebook?",o:["She was annoyed that the writer had found it.","She was surprised because she thought it was lost.","She was unsure who had written it.","She immediately wanted to start cooking."],a:1,e:"I thought it had been lost years ago → B。"},
   {n:33,q:"What do we learn about the notes in the margins?",o:["They were written by the writer's grandmother.","They gave opinions about some of the dishes.","They were very difficult to read.","They explained how to cook each dish."],a:1,e:"'too much salt!'、'Mr Brown's favourite' 都是對菜的評語 → B。"},
   {n:34,q:"How did the writer feel about cooking every day at first?",o:["excited","unenthusiastic","embarrassed","curious"],a:1,e:"I wasn't especially keen at first（一開始不太想）→ B。"},
   {n:35,q:"What does the writer realise in paragraph 4?",o:["Cooking was harder than she had expected.","Her grandmother was a better cook than her mother.","Cooking helped her to learn about her family's past.","The hotel guests had not been very friendly."],a:2,e:"做菜時奶奶講了很多家族故事，認識了從沒見過的曾祖母 → C。"},
   {n:36,q:"What did the writer do after returning home?",o:["She gave the original notebook to her cousins.","She shared the recipes with other family members.","She started cooking for a hotel.","She asked her grandmother to send more recipes."],a:1,e:"打字整理、給每個表親一份 → B。陷阱 A：原本的筆記本奶奶留著。"}]},
 {part:6,title:"The Return of the Wolves",
  passage:["In 1995, wolves were brought back to Yellowstone National Park in the United States after an absence of around 70 years. {37} However, what happened next surprised even the scientists who had planned the project.",
   "Without wolves, the number of elk – a type of large deer – had grown enormously. The elk ate so many young trees and plants that some areas of the valleys had become almost bare. {38} The elk began to avoid open areas where they could easily be caught, and plants in those places started to grow back.",
   "As trees returned along the rivers, so did many birds. {39} Beavers also came back, as they rely on trees to build their dams. These dams created pools of water, which in turn provided homes for fish, frogs and other creatures.",
   "Some scientists even claim that the wolves changed the shape of the rivers themselves. {40} With fewer animals eating the plants on the riverbanks, the soil was held together by roots and the banks became more stable.",
   "Not everyone agrees with this version of events. {41} They point out that other factors, such as changes in rainfall and human activity, may also have played a part.",
   "Whatever the full explanation, the Yellowstone story has become a famous example of how removing or returning a single species can affect an entire area. {42}"],
  sents:{A:"When the wolves arrived, this began to change.",B:"Their aim was to restore a natural balance to the park.",C:"Songbirds, for example, nested in the new branches and fed on the insects that lived there.",D:"Their argument is that the riverbanks stopped falling apart as quickly.",E:"Some researchers believe the effects of the wolves have been exaggerated.",F:"It has encouraged similar projects in other parts of the world.",G:"Wolves are now the most common animal in the park."},
  items:[
   {n:37,a:"B",e:"前面說把狼帶回公園，Their aim 說明目的；後面 However… surprised 形成對比 → B。"},
   {n:38,a:"A",e:"前面說鹿太多、植物被吃光；this began to change 接著說鹿開始避開空地 → A。"},
   {n:39,a:"C",e:"前一句說鳥回來了，Songbirds, for example 舉例 → C。"},
   {n:40,a:"D",e:"前一句說狼改變了河流形狀，Their argument is that… 解釋說法；後一句說河岸變穩固 → D。"},
   {n:41,a:"E",e:"Not everyone agrees… 接著 Some researchers believe… exaggerated；後面 They point out 指這些研究者 → E。"},
   {n:42,a:"F",e:"結尾說這是有名的例子，It has encouraged similar projects 收尾 → F。G 不對：文中沒說狼是最常見的動物。"}]},
 {part:7,
  texts:[
   {id:"A",name:"Sofia",t:"I started the violin when I was six because my parents thought it would be good for me. For years I hated practising, and I almost gave up when I was ten. What changed my mind was joining a youth orchestra. Playing with other people is completely different from practising alone – suddenly the music made sense. Now I practise every day without anyone telling me to."},
   {id:"B",name:"Leo",t:"I taught myself the drums by watching online videos. My parents weren't thrilled about the noise, so I built a soundproof corner in our garage using old mattresses! I'm in a band with three friends now. We've only played one concert, at a school fair, but we were paid with free pizza, which I think counts as our first professional job."},
   {id:"C",name:"Hana",t:"My grandfather gave me his old guitar for my twelfth birthday. It's not a particularly good instrument, and a teacher once suggested I should buy a better one, but I'd never swap it. I mostly play songs I write myself. They're quite personal, so I rarely perform them for anyone – I just play for my own enjoyment."},
   {id:"D",name:"Josh",t:"I take piano exams every year, and last year I got the highest mark in my region. People assume I must practise for hours, but actually I only do thirty minutes a day. The secret is to practise properly – focusing on the difficult parts rather than playing the bits you already know. I'd like to study music at university."}],
  items:[
   {n:43,q:"started learning because of their parents' wishes?",a:"A",e:"Sofia：because my parents thought it would be good for me。"},
   {n:44,q:"learnt to play without a teacher?",a:"B",e:"Leo：I taught myself the drums by watching online videos。"},
   {n:45,q:"had to solve a problem caused by their playing?",a:"B",e:"Leo：爸媽受不了噪音，所以做了隔音角落。"},
   {n:46,q:"prefers to keep their music private?",a:"C",e:"Hana：I rarely perform them for anyone。"},
   {n:47,q:"has achieved an excellent result in an assessment?",a:"D",e:"Josh：got the highest mark in my region（考試成績全區最高）。"},
   {n:48,q:"says that playing with others changed their attitude?",a:"A",e:"Sofia：What changed my mind was joining a youth orchestra。"},
   {n:49,q:"has ignored some advice they were given?",a:"C",e:"Hana：老師建議換一把好吉他，but I'd never swap it。"},
   {n:50,q:"believes the way you practise matters more than how long you practise?",a:"D",e:"Josh：只練 30 分鐘，The secret is to practise properly。"},
   {n:51,q:"has been rewarded for performing?",a:"B",e:"Leo：we were paid with free pizza。"},
   {n:52,q:"has plans for further study?",a:"D",e:"Josh：I'd like to study music at university。"}]}

lis:[
 {part:1,items:[
   {n:1,q:"You hear a girl talking about a holiday. What did she enjoy most?",o:["the beach","the food","the hotel"],a:1,s:[["G","The hotel was lovely, with a huge pool, and the beach was only five minutes away – though it was a bit too crowded for me."],["G","But honestly, the thing I'll remember is the meals. I tried something new every single day, and I still dream about the fish soup."]],e:"the thing I'll remember is the meals → B。海灘她覺得太擠。"},
   {n:2,q:"You hear a boy talking about a football match. Why didn't he play?",o:["He was injured.","He arrived late.","The coach chose someone else."],a:1,s:[["B","I'd been training all week and I felt great – no problems with my knee any more."],["B","But the bus got stuck in traffic, and by the time I got to the pitch, the game had already started, so the coach couldn't put me in."]],e:"公車塞車、比賽已經開始 → 遲到 B。陷阱 A：膝蓋已經沒問題。"},
   {n:3,q:"You hear a teacher talking to her class. What is she telling them about?",o:["a change to an exam date","a new library rule","a school trip"],a:0,s:[["W","Listen carefully, everyone. The history exam was supposed to be on Monday, but because the hall is being used for the school concert, it's been moved to Wednesday."],["W","It'll still start at nine o'clock, so please don't be late."]],e:"考試從星期一改到星期三 → A。"},
   {n:4,q:"You hear two friends talking about a new café. What does the boy think of it?",o:["It's too expensive.","The service is slow.","The drinks are excellent."],a:2,s:[["G","Have you been to that new café on the corner yet?"],["B","Yeah, last week. The hot chocolate was amazing – the best I've ever had. It wasn't cheap, but I didn't mind paying a bit more for something that good."]],e:"熱可可是喝過最好的 → C。陷阱 A：不便宜，但他 didn't mind。"},
   {n:5,q:"You hear a girl talking about a book. Why did she choose it?",o:["A friend recommended it.","She liked the cover.","She had seen the film."],a:0,s:[["G","I'd never heard of the author, and to be honest, I haven't seen the film either."],["G","My best friend kept going on about it, saying I'd love it, so in the end I borrowed her copy. She was right!"]],e:"好朋友一直推薦 → A。陷阱 C：她沒看過電影。"},
   {n:6,q:"You hear a man on the radio. What is he doing?",o:["advertising a product","describing a sports event","giving a weather forecast"],a:2,s:[["M","It's going to be a cold start tomorrow, with frost in the north. By the afternoon, though, the sun will come out and temperatures will rise to around twelve degrees."],["M","Perfect conditions, then, for this weekend's city marathon."]],e:"霜、出太陽、溫度 → 天氣預報 C。馬拉松只是順便提。"},
   {n:7,q:"You hear a boy talking to his mother. What does he want?",o:["permission to go out","help with his homework","some money"],a:0,s:[["B","Mum, I've finished all my homework, honestly. So can I go round to Jake's house?"],["B","His dad said he'll drive me home before nine."]],e:"可以去 Jake 家嗎 → 想得到外出的許可 A。"},
   {n:8,q:"You hear a girl talking about her first day at a new school. How did she feel at the end of the day?",o:["worried","relieved","bored"],a:1,s:[["G","I'd been so nervous about not knowing anyone that I hardly slept the night before."],["G","But a girl in my class showed me around and we had lunch together. By home time I thought, 'Phew, that wasn't so bad after all.'"]],e:"Phew, that wasn't so bad → 鬆了一口氣 B。陷阱 A：緊張是前一天晚上。"}]},
 {part:2,
  s:[["B","Hello, I'm Daniel, and last summer I spent two weeks at Ridgeway Adventure Camp in Wales. I went with my school, and there were about sixty of us altogether."],
     ["B","We slept in wooden cabins, eight people in each. I'd expected tents, so that was a nice surprise."],
     ["B","Every day started with a run at seven o'clock, which most of us hated! Then we did different activities. My favourite was kayaking on the lake, although rock climbing was the most popular with everyone else."],
     ["B","The food was better than I expected. The cook, a woman called Mrs Evans, made the best pancakes I've ever eaten – we had them every Sunday."],
     ["B","On the last night there was a talent show. I played the guitar with two friends, and we came second. The winner was a girl who did magic tricks."],
     ["B","The best thing I learned at camp was how to work as part of a team. And if you're thinking of going, my advice is: bring lots of warm socks – it gets surprisingly cold at night, even in summer."]],

   {n:11,before:"The students slept in wooden",after:".",a:["cabins","cabin"],e:"We slept in wooden cabins。陷阱：tents 是他原本以為的。"},
   {n:12,before:"Daniel's favourite activity was",after:".",a:["kayaking"],e:"My favourite was kayaking on the lake。"},
   {n:13,before:"The most popular activity with the other students was",after:".",a:["rock climbing","rock-climbing","climbing"],e:"rock climbing was the most popular with everyone else。"},
   {n:14,before:"The camp served pancakes every",after:".",a:["sunday"],e:"we had them every Sunday。"},
   {n:15,before:"In the talent show, Daniel played the",after:".",a:["guitar"],e:"I played the guitar with two friends。"},
   {n:16,before:"The winner of the talent show did",after:".",a:["magic tricks","magic","tricks"],e:"The winner was a girl who did magic tricks。"},
   {n:17,before:"Daniel says the camp taught him to work as part of a",after:".",a:["team"],e:"how to work as part of a team。"},
   {n:18,before:"Daniel advises people to bring warm",after:".",a:["socks"],e:"bring lots of warm socks。"}]},
 {part:3,
  opts:{A:"They enjoy being surrounded by nature.",B:"They like having time to do nothing.",C:"They use the time to earn money.",D:"They spend it with their grandparents.",E:"They use it to catch up on schoolwork.",F:"They are learning a new skill.",G:"They meet their friends in town.",H:"They play a sport in a team that competes."},
  items:[
   {n:19,sp:"Speaker 1",s:[["G","During the week I'm so busy with school and swimming training that at weekends I just want to stay in bed, watch films and not think about anything. My mum says I'm lazy, but I think I deserve the rest!"]],a:"B",e:"週末只想躺著什麼都不做 → B。陷阱 H：游泳訓練是平日。"},
   {n:20,sp:"Speaker 2",s:[["B","My grandparents live on a farm, and we used to go there every weekend, but now they've moved into town. These days I go hiking in the hills with my dad. There's nothing better than being surrounded by trees and hearing nothing but birds."]],a:"A",e:"在山裡健行、被樹包圍 → A。陷阱 D：那是以前的事。"},
   {n:21,sp:"Speaker 3",s:[["G","I help out at my uncle's bakery on Saturday mornings. I have to get up at five, which is tough, but he pays me well and I'm saving for a new bike. After that I'm usually too tired to go anywhere."]],a:"C",e:"在麵包店幫忙、有工資、存錢買腳踏車 → C。"},
   {n:22,sp:"Speaker 4",s:[["B","I've recently started going to a cooking class on Sunday afternoons. Last week we learned how to make fresh pasta. I'd never cooked anything before, so everything is new and exciting."]],a:"F",e:"上烹飪課、學新的東西 → F。"},
   {n:23,sp:"Speaker 5",s:[["G","Saturdays are match days for my volleyball team. We're top of the league at the moment, so every game really matters. By Sunday I'm usually exhausted!"]],a:"H",e:"排球隊、聯賽第一名、比賽 → H。"}]},
 {part:4,
  s:[["W","Today I'm talking to sixteen-year-old Lily Grant, who has just won a national award for young inventors. Lily, tell us about your invention."],
     ["G","It's a small device that reminds people to drink water. It lights up and makes a gentle sound every hour. I made it for my grandmother, who often forgets to drink enough, especially in summer."],
     ["W","How did you build it?"],
     ["G","I'd learned some basic electronics at a weekend club, but I'd never made anything this complicated. I watched lots of online tutorials, and my physics teacher let me use the school lab after lessons. That's where I built it."],
     ["W","Were there any problems?"],
     ["G","Loads! The first version was far too big – it was the size of a shoebox. My grandmother said she'd never carry that around. So I had to start again and make everything much smaller."],
     ["W","How did you feel when you won the award?"],
     ["G","I honestly didn't expect it. The other inventions were amazing – one boy had built a robot that sorts rubbish for recycling. When they called my name, I just stood there. I couldn't move."],
     ["W","What happens next?"],
     ["G","A company has asked whether they can produce it, which is exciting. But first I want to test it with more older people to see what they think. I don't want to rush it."],
     ["W","Do you want to be an inventor when you grow up?"],
     ["G","Maybe. Everyone assumes I'll study engineering, but actually I'm really interested in medicine. Perhaps I can combine the two and design equipment for hospitals."],
     ["W","Any advice for young inventors?"],
     ["G","Start with a problem that someone you know actually has. If you care about the person, you won't give up when things go wrong."]],
  items:[
   {n:24,q:"Why did Lily make the device?",o:["to enter a competition","to help a relative","to sell it online"],a:1,e:"I made it for my grandmother → B。"},
   {n:25,q:"Where did Lily build the device?",o:["at home","at a weekend club","in the school lab"],a:2,e:"my physics teacher let me use the school lab… That's where I built it → C。陷阱 B：週末社團只是學過基礎電子。"},
   {n:26,q:"What was the problem with the first version?",o:["It was too large.","It was too noisy.","It did not work."],a:0,e:"far too big – the size of a shoebox → A。"},
   {n:27,q:"How did Lily feel when she won?",o:["She had expected to win.","She was too shocked to react.","She felt sorry for the other competitors."],a:1,e:"I just stood there. I couldn't move → 嚇到不知道怎麼反應 B。"},
   {n:28,q:"What does Lily want to do before the device is produced?",o:["get opinions from more users","make it cheaper","add new features"],a:0,e:"test it with more older people to see what they think → A。"},
   {n:29,q:"What is Lily most interested in studying?",o:["engineering","medicine","design"],a:1,e:"actually I'm really interested in medicine → B。陷阱 A：那是大家以為的。"},
   {n:30,q:"What is Lily's advice for young inventors?",o:["Try to solve a real problem for someone you know.","Always work as part of a team.","Don't worry about making mistakes."],a:0,e:"Start with a problem that someone you know actually has → A。"}]}
],
